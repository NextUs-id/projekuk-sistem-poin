<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kelas & Jurusan — SMK TI Bali Global Denpasar</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s;
        }

        .premium-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-slide-down {
            animation: slideDown 0.3s ease-out forwards;
        }

        .folder-item {
            transition: all 0.2s;
        }

        .folder-item:hover {
            background: rgba(196, 241, 104, 0.1);
        }

        .folder-item.active {
            background: rgba(196, 241, 104, 0.15);
            border-left: 3px solid #C4F168;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans">
    <div id="app"></div>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-lg">
                <i data-lucide="folder-tree" class="w-7 h-7 text-accent"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black text-primary">Kelola Kelas &amp; Jurusan</h1>
                <p class="text-slate-500 text-sm font-medium">Manajemen rombel dan kompetensi keahlian</p>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="book-open" class="w-6 h-6 text-emerald-500"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Total Jurusan</p>
                        <p id="stat-jurusan" class="text-2xl font-black text-primary">-</p>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="users" class="w-6 h-6 text-blue-500"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Total Kelas</p>
                        <p id="stat-kelas" class="text-2xl font-black text-primary">-</p>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="graduation-cap" class="w-6 h-6 text-amber-500"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Siswa Terassign</p>
                        <p id="stat-siswa" class="text-2xl font-black text-primary">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Daftar Jurusan -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden mb-6">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i data-lucide="book-open" class="w-5 h-5 text-slate-400"></i>
                    <span class="text-sm font-black text-slate-600 uppercase tracking-wider">Daftar Jurusan</span>
                </div>
                <button onclick="openJurusanModal()"
                    class="px-4 py-2 bg-primary text-accent rounded-xl text-xs font-black uppercase tracking-widest hover:scale-105 transition-all flex items-center gap-2">
                    <i data-lucide="plus" class="w-3 h-3"></i> Tambah
                </button>
            </div>
            <div id="jurusan-list-container">
                <div class="p-8 text-center text-slate-400">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
                    <span class="text-sm">Memuat data...</span>
                </div>
            </div>
        </div>

        <!-- File Explorer Style -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex items-center gap-3">
                <i data-lucide="folder" class="w-5 h-5 text-slate-400"></i>
                <span class="text-sm font-black text-slate-600 uppercase tracking-wider">Struktur Kelas</span>
            </div>

            <!-- Accordion Levels: X, XI, XII -->
            <div id="folder-container" class="divide-y divide-slate-50">
                <!-- Loaded via JS -->
                <div class="p-8 text-center text-slate-400">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
                    <span class="text-sm">Memuat data...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Confirm Modal -->
    <div id="modal-confirm"
        class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm scale-95 opacity-0 transition-all duration-300">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-red-400"></i>
                </div>
                <h3 id="confirm-title" class="text-lg font-black text-primary mb-2">Konfirmasi</h3>
                <p id="confirm-message" class="text-sm text-slate-500"></p>
            </div>
            <div class="flex gap-4 p-6 pt-0">
                <button id="confirm-cancel"
                    class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Batal</button>
                <button id="confirm-ok"
                    class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-red-500 text-white hover:bg-red-600 transition-all">Hapus</button>
            </div>
        </div>
    </div>

    <!-- Modal Jurusan -->
    <div id="modal-jurusan"
        class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md scale-95 opacity-0 transition-all duration-300">
            <div class="p-8 border-b border-slate-50 flex items-center justify-between">
                <h2 id="modal-jurusan-title" class="text-xl font-black text-primary">Tambah Jurusan</h2>
                <button onclick="closeJurusanModal()"
                    class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 flex items-center justify-center transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="form-jurusan" class="p-8 space-y-6">
                <input type="hidden" id="j-id">
                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-400 uppercase">Kode Jurusan</label>
                    <input type="text" id="j-kode" placeholder="Contoh: RPL, AK, TS"
                        class="w-full px-4 py-3 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-primary focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none uppercase"
                        required>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-400 uppercase">Nama Jurusan</label>
                    <input type="text" id="j-nama" placeholder="Contoh: Rekayasa Perangkat Lunak"
                        class="w-full px-4 py-3 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-primary focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none"
                        required>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeJurusanModal()"
                        class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200">Batal</button>
                    <button type="submit"
                        class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-primary text-accent hover:scale-105 transition-all">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Kelas -->
    <div id="modal-kelas"
        class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md scale-95 opacity-0 transition-all duration-300">
            <div class="p-8 border-b border-slate-50 flex items-center justify-between">
                <h2 id="modal-kelas-title" class="text-xl font-black text-primary">Tambah Kelas</h2>
                <button onclick="closeKelasModal()"
                    class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 flex items-center justify-center transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="form-kelas" class="p-8 space-y-6">
                <input type="hidden" id="k-id">
                <div class="grid grid-cols-3 gap-4">
                    <div class="space-y-2">
                        <label class="block text-xs font-black text-slate-400 uppercase">Tingkat</label>
                        <select id="k-tingkat"
                            class="w-full px-3 py-3 rounded-2xl border border-slate-100 bg-slate-100 text-slate-500 font-bold outline-none cursor-not-allowed appearance-none"
                            disabled required>
                            <option value="X">X</option>
                            <option value="XI">XI</option>
                            <option value="XII">XII</option>
                        </select>
                    </div>
                    <div class="col-span-2 space-y-2">
                        <label class="block text-xs font-black text-slate-400 uppercase">Jurusan</label>
                        <select id="k-jurusan"
                            class="w-full px-3 py-3 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-primary focus:border-accent outline-none"
                            required>
                            <!-- Loaded via JS -->
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-400 uppercase">Nomor Kelas</label>
                    <input type="number" id="k-nomor" value="1" min="1"
                        class="w-full px-4 py-3 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-primary focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none"
                        required>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-400 uppercase">Wali Kelas (Opsional)</label>
                    <select id="k-wali"
                        class="w-full px-4 py-3 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-primary focus:border-accent outline-none">
                        <option value="">-- Pilih Wali --</option>
                        <!-- Loaded via JS -->
                    </select>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeKelasModal()"
                        class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200">Batal</button>
                    <button type="submit"
                        class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-primary text-accent hover:scale-105 transition-all">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let jurusans = [];
        let kelass = { X: [], XI: [], XII: [] };
        let allGurus = [];
        let openTingkat = null; // 'X', 'XI', or 'XII'

        (async () => {
            const user = await requireLogin();
            if (!user || user.role !== 'admin') { window.location.href = '/dashboard'; return; }
            renderLayout(user);

            await loadData();
        })();

        async function loadData() {
            const [jRes, kRes] = await Promise.all([
                api('/api/admin/jurusans'),
                api('/api/admin/kelass')
            ]);

            if (jRes.ok) jurusans = jRes.data;
            if (kRes.ok) kelass = kRes.grouped;

            // Update stats
            document.getElementById('stat-jurusan').textContent = jurusans.length;
            const totalKelas = kelass.X.length + kelass.XI.length + kelass.XII.length;
            document.getElementById('stat-kelas').textContent = totalKelas;

            // Populate select options
            const jurusanSelect = document.getElementById('k-jurusan');
            jurusanSelect.innerHTML = jurusans.map(j => `<option value="${j.id}">${j.kode} - ${j.nama}</option>`).join('');

            // Load guru-wali
            const gRes = await api('/api/admin/guru-wali');
            if (gRes.ok) {
                allGurus = gRes.data;
            }

            renderFolders();
            renderJurusanList();
        }

        function renderJurusanList() {
            const el = document.getElementById('jurusan-list-container');
            if (!jurusans.length) {
                el.innerHTML = `<div class="px-6 py-10 text-center text-slate-400 text-sm">Belum ada jurusan. Klik Tambah untuk menambahkan.</div>`;
                return;
            }
            el.innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50/60">
                            <th class="text-left px-6 py-3 font-black text-slate-400 text-[10px] uppercase tracking-widest">Kode</th>
                            <th class="text-left px-6 py-3 font-black text-slate-400 text-[10px] uppercase tracking-widest">Nama Jurusan</th>
                            <th class="text-center px-6 py-3 font-black text-slate-400 text-[10px] uppercase tracking-widest">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        ${jurusans.map(j => `
                            <tr class="hover:bg-slate-50/50 transition-colors">
                                <td class="px-6 py-4">
                                    <span class="px-3 py-1 rounded-lg bg-primary text-accent text-[10px] font-black uppercase tracking-widest">${escapeHtml(j.kode)}</span>
                                </td>
                                <td class="px-6 py-4 font-bold text-primary">${escapeHtml(j.nama)}</td>
                                <td class="px-6 py-4">
                                    <div class="flex justify-center gap-2">
                                        <button onclick="openJurusanModal(${j.id})" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center transition-all">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </button>
                                        <button onclick="deleteJurusan(${j.id}, '${escapeHtml(j.nama)}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 flex items-center justify-center transition-all">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            lucide.createIcons();
        }

        async function deleteJurusan(id, nama) {
            const ok = await confirmAction('Hapus Jurusan', `Hapus jurusan "${nama}"? Pastikan tidak ada kelas yang menggunakan jurusan ini.`);
            if (!ok) return;
            const res = await api(`/api/admin/jurusans?id=${id}`, { method: 'DELETE' });
            if (res.ok) {
                showAlert('Jurusan berhasil dihapus.', 'success');
                loadData();
            } else {
                showAlert(res.error, 'error');
            }
        }

        function confirmAction(title, message) {
            return new Promise(resolve => {
                const modal = document.getElementById('modal-confirm');
                document.getElementById('confirm-title').textContent = title;
                document.getElementById('confirm-message').textContent = message;
                modal.classList.remove('hidden');
                setTimeout(() => modal.querySelector('div:first-child').classList.remove('scale-95', 'opacity-0'), 10);
                lucide.createIcons();

                const btnOk = document.getElementById('confirm-ok');
                const btnCancel = document.getElementById('confirm-cancel');

                function cleanup() {
                    modal.querySelector('div:first-child').classList.add('scale-95', 'opacity-0');
                    setTimeout(() => modal.classList.add('hidden'), 300);
                    btnOk.removeEventListener('click', onOk);
                    btnCancel.removeEventListener('click', onCancel);
                }
                function onOk() { cleanup(); resolve(true); }
                function onCancel() { cleanup(); resolve(false); }

                btnOk.addEventListener('click', onOk);
                btnCancel.addEventListener('click', onCancel);
            });
        }

        function renderFolders() {
            const container = document.getElementById('folder-container');
            const tingkatList = ['X', 'XI', 'XII'];
            const icons = { X: '1', XI: '2', XII: '3' };

            container.innerHTML = tingkatList.map(tingkat => {
                const isOpen = openTingkat === tingkat;
                const items = kelass[tingkat] || [];

                return `
                <div class="folder-section">
                <div class="folder-section group border-b border-transparent last:border-none">
                    <div onclick="toggleFolder('${tingkat}')" class="w-full flex flex-row items-center justify-between p-5 hover:bg-slate-50 transition-colors cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl ${isOpen ? 'bg-primary text-accent' : 'bg-slate-100 text-slate-400 group-hover:bg-slate-200 group-hover:text-primary'} flex items-center justify-center font-black text-lg transition-colors">
                                ${icons[tingkat]}
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-black text-primary uppercase tracking-widest">Kelas ${tingkat}</p>
                                <p class="text-xs font-bold text-slate-400 mt-0.5">${items.length} kelas di tingkat ini</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="event.stopPropagation(); openKelasModal('${tingkat}')" class="w-10 h-10 rounded-xl bg-primary text-accent flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-md shadow-primary/20">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </button>
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 transition-transform ${isOpen ? 'rotate-180' : ''}">
                                <i data-lucide="chevron-down" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </div>
                    ${isOpen ? `
                    <div class="bg-slate-25 animate-slide-down overflow-hidden">
                        ${items.length > 0 ? items.map(k => `
                        <div class="folder-item flex items-center justify-between px-6 py-4 pl-16 border-l-2 border-transparent hover:border-accent">
                            <div class="flex items-center gap-3">
                                <i data-lucide="folder" class="w-5 h-5 text-blue-500"></i>
                                <span class="font-bold text-primary">${k.nama_kelas}</span>
                                ${k.nama_wali ? `<span class="text-xs text-slate-400">(${k.nama_wali})</span>` : ''}
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="editKelas(${k.id})" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteKelas(${k.id}, '${k.nama_kelas}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 flex items-center justify-center">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                        `).join('') : `
                        <div class="px-6 py-8 pl-16 text-center text-slate-400 text-sm">
                            Belum ada kelas. Klik + untuk menambah.
                        </div>
                        `}
                    </div>
                    ` : ''}
                </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function toggleFolder(tingkat) {
            openTingkat = openTingkat === tingkat ? null : tingkat;
            renderFolders();
        }

        // --- Jurusan Modal ---
        function openJurusanModal(id = null) {
            document.getElementById('modal-jurusan-title').textContent = id ? 'Edit Jurusan' : 'Tambah Jurusan';
            document.getElementById('j-id').value = id || '';

            if (id) {
                const j = jurusans.find(x => x.id == id);
                document.getElementById('j-kode').value = j.kode;
                document.getElementById('j-nama').value = j.nama;
            } else {
                document.getElementById('form-jurusan').reset();
            }

            document.getElementById('modal-jurusan').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal-jurusan').querySelector('div:last-child').classList.remove('scale-95', 'opacity-0');
            }, 10);
            lucide.createIcons();
        }

        function closeJurusanModal() {
            const modal = document.getElementById('modal-jurusan');
            modal.querySelector('div:last-child').classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        document.getElementById('form-jurusan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('j-id').value;
            const kode = document.getElementById('j-kode').value.trim().toUpperCase();
            const nama = document.getElementById('j-nama').value.trim();

            const method = id ? 'PUT' : 'POST';
            const res = await api('/api/admin/jurusans', {
                method,
                body: { id: id ? parseInt(id) : null, kode, nama }
            });

            if (res.ok) {
                showAlert(res.message, 'success');
                closeJurusanModal();
                loadData();
            } else {
                showAlert(res.error, 'error');
            }
        });

        // --- Kelas Modal ---
        let currentEditKelas = null;

        function openKelasModal(tingkat, id = null) {
            document.getElementById('modal-kelas-title').textContent = id ? `Edit Kelas ${tingkat}` : `Tambah Kelas ${tingkat}`;
            document.getElementById('k-id').value = id || '';

            const occupiedWali = new Set();
            ['X', 'XI', 'XII'].forEach(t => {
                kelass[t].forEach(k => {
                    if (k.id_wali_guru) occupiedWali.add(parseInt(k.id_wali_guru));
                });
            });

            let currentWaliId = null;
            if (id) {
                const k = kelass[tingkat].find(x => x.id === id);
                if (k && k.id_wali_guru) currentWaliId = parseInt(k.id_wali_guru);
            }

            const waliSelect = document.getElementById('k-wali');
            waliSelect.innerHTML = '<option value="">-- Pilih Wali --</option>' +
                allGurus.filter(g => !occupiedWali.has(parseInt(g.id)) || parseInt(g.id) === currentWaliId)
                    .map(g => `<option value="${g.id}">${g.nama_asli} (${g.role})</option>`).join('');

            if (id) {
                const k = kelass[tingkat].find(x => x.id === id);
                document.getElementById('k-tingkat').value = k.tingkat;
                document.getElementById('k-jurusan').value = k.id_jurusan;
                document.getElementById('k-nomor').value = k.nomor;
                document.getElementById('k-wali').value = k.id_wali_guru || '';
            } else {
                document.getElementById('form-kelas').reset();
                document.getElementById('k-tingkat').value = tingkat || 'X';
                document.getElementById('k-nomor').value = 1;
            }

            document.getElementById('modal-kelas').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal-kelas').querySelector('div:last-child').classList.remove('scale-95', 'opacity-0');
            }, 10);
            lucide.createIcons();
        }

        function closeKelasModal() {
            const modal = document.getElementById('modal-kelas');
            modal.querySelector('div:last-child').classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        document.getElementById('form-kelas').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('k-id').value;
            const tingkat = document.getElementById('k-tingkat').value;
            const id_jurusan = parseInt(document.getElementById('k-jurusan').value);
            const nomor = parseInt(document.getElementById('k-nomor').value);
            const id_wali_guru = parseInt(document.getElementById('k-wali').value) || 0;

            if (!id_jurusan) { showAlert('Pilih jurusan terlebih dahulu.', 'error'); return; }

            const res = await api('/api/admin/kelass', {
                method: id ? 'PUT' : 'POST',
                body: { id: id ? parseInt(id) : null, tingkat, id_jurusan, nomor, id_wali_guru }
            });

            if (res.ok) {
                showAlert(res.message, 'success');
                closeKelasModal();
                openTingkat = tingkat;
                loadData();
            } else {
                showAlert(res.error, 'error');
            }
        });

        function editKelas(id) {
            // Find kelas data
            for (const tingkat of ['X', 'XI', 'XII']) {
                const k = kelass[tingkat].find(x => x.id === id);
                if (k) {
                    openKelasModal(tingkat, id);
                    document.getElementById('k-jurusan').value = k.id_jurusan;
                    document.getElementById('k-nomor').value = k.nomor;
                    document.getElementById('k-wali').value = k.id_wali_guru || '';
                    break;
                }
            }
        }

        async function deleteKelas(id, nama) {
            const ok = await confirmAction('Hapus Kelas', `Hapus kelas "${nama}"?`);
            if (!ok) return;

            const res = await api(`/api/admin/kelass?id=${id}`, { method: 'DELETE' });
            if (res.ok) {
                showAlert('Kelas dihapus', 'success');
                loadData();
            } else {
                showAlert(res.error, 'error');
            }
        }
    </script>
</body>

</html>
