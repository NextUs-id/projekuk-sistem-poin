<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Users — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .role-btn {
            @apply px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-widest transition-all border;
        }
        
        .role-btn-inactive {
            @apply border-slate-100 bg-white text-slate-400 hover:border-accent hover:text-primary hover:shadow-lg hover:shadow-accent/10;
        }
        
        .role-btn-active {
            @apply border-primary bg-primary text-accent shadow-xl shadow-primary/20;
        }

        /* Status Badges */
        .status-badge {
            @apply px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest inline-flex items-center gap-1.5;
        }
        
        .status-aktif { @apply bg-emerald-50 text-emerald-600; }
        .status-nonaktif { @apply bg-red-50 text-red-600; }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper — sidebar + topbar di-generate oleh renderLayout() -->
    <div id="app"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-2xl shadow-primary/20">
                    <i data-lucide="users" class="w-7 h-7 text-accent"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Kelola Users</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Manajemen akun & hak akses sistem</p>
                </div>
            </div>
            <button onclick="openCreateModal()"
                class="group flex items-center gap-2 px-6 py-4 bg-primary text-accent rounded-2xl font-black text-sm uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-xl shadow-primary/10 cursor-pointer">
                <i data-lucide="user-plus" class="w-5 h-5 transition-transform group-hover:rotate-12"></i>
                Tambah User
            </button>
        </div>

        <!-- Filter & Search Section -->
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-8">
            <div class="flex flex-wrap gap-2" id="filter-container">
                <button onclick="filterRole('all')" data-role="all" class="role-btn role-btn-active">Semua</button>
                <button onclick="filterRole('admin')" data-role="admin"
                    class="role-btn role-btn-inactive">Admin</button>
                <button onclick="filterRole('bk')" data-role="bk" class="role-btn role-btn-inactive">BK</button>
                <button onclick="filterRole('guru')" data-role="guru" class="role-btn role-btn-inactive">Guru</button>
                <button onclick="filterRole('kepsek')" data-role="kepsek"
                    class="role-btn role-btn-inactive">Kepsek</button>
                <button onclick="filterRole('siswa')" data-role="siswa"
                    class="role-btn role-btn-inactive">Siswa</button>
            </div>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-50 bg-slate-50/30">
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                User</th>
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Role & Status</th>
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Aktivitas Terakhir</th>
                            <th
                                class="text-center px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody" class="divide-y divide-slate-50">
                        <tr>
                            <td colspan="4" class="px-8 py-20 text-center text-slate-400">
                                <div class="flex flex-col items-center gap-3">
                                    <div
                                        class="w-12 h-12 border-4 border-accent border-t-primary rounded-full animate-spin">
                                    </div>
                                    <span class="font-bold text-sm tracking-widest uppercase">Memuat data user...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Confirm Delete Modal -->
    <div id="modal-del-user"
        class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div id="modal-del-user-box"
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm scale-95 opacity-0 transition-all duration-300">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="user-x" class="w-8 h-8 text-red-400"></i>
                </div>
                <h3 class="text-lg font-black text-primary mb-2">Hapus User</h3>
                <p id="modal-del-user-msg" class="text-sm text-slate-500"></p>
            </div>
            <div class="flex gap-4 p-6 pt-0">
                <button id="modal-del-user-cancel"
                    class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Batal</button>
                <button id="modal-del-user-ok"
                    class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-red-500 text-white hover:bg-red-600 transition-all">Hapus</button>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="modal-reset-pw"
        class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div id="modal-reset-pw-box"
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm scale-95 opacity-0 transition-all duration-300">
            <div class="p-8">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="key-round" class="w-6 h-6 text-amber-500"></i>
                    </div>
                    <h3 class="text-lg font-black text-primary">Reset Password</h3>
                </div>
                <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Password
                    Baru</label>
                <input type="password" id="modal-reset-pw-input"
                    class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-primary focus:border-amber-400 focus:ring-4 focus:ring-amber-400/10 outline-none transition-all"
                    placeholder="••••••••">
            </div>
            <div class="flex gap-4 p-6 pt-0">
                <button id="modal-reset-pw-cancel"
                    class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Batal</button>
                <button id="modal-reset-pw-ok"
                    class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-amber-500 text-white hover:bg-amber-600 transition-all">Reset</button>
            </div>
        </div>
    </div>

    <!-- User Detail Modal -->
    <div id="modal-detail"
        class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div id="modal-detail-box"
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto scale-95 opacity-0 transition-all duration-300">
            <div class="p-8 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center gap-3">
                    <div id="detail-avatar"
                        class="w-14 h-14 rounded-2xl bg-accent/20 flex items-center justify-center text-primary font-black text-xl shadow-xl shadow-accent/5">
                    </div>
                    <div>
                        <p id="detail-name" class="text-lg font-black text-primary"></p>
                        <p id="detail-username" class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="detail-edit-btn"
                        class="w-10 h-10 rounded-xl bg-slate-100 text-slate-500 hover:bg-primary hover:text-accent transition-all flex items-center justify-center"
                        title="Edit">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="closeDetailModal()"
                        class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-400 transition-all flex items-center justify-center">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="detail-body" class="p-8 space-y-6"></div>
        </div>
    </div>

    <!-- Modal Create/Edit -->
    <div id="modal"
        class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4 transition-all duration-300">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl max-h-[90vh] overflow-hidden flex flex-col scale-95 opacity-0 transition-all duration-300"
            id="modal-content">
            <!-- Modal Header -->
            <div class="p-8 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center">
                        <i data-lucide="user-cog" class="w-6 h-6 text-accent"></i>
                    </div>
                    <div>
                        <h2 id="modal-title" class="text-2xl font-black text-primary tracking-tight">Tambah User</h2>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Informasi Akun & Akses
                        </p>
                    </div>
                </div>
                <button onclick="closeModal()"
                    class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <form id="user-form" class="p-8 overflow-y-auto space-y-8">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Username -->
                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Username
                            / NIS</label>
                        <div class="relative group">
                            <i data-lucide="at-sign"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="text" id="f-username" required
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all placeholder:text-slate-300"
                                placeholder="nexus_admin">
                        </div>
                    </div>

                    <!-- Nama Lengkap -->
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Nama
                            Lengkap</label>
                        <div class="relative group">
                            <i data-lucide="user"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="text" id="f-nama" required
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all placeholder:text-slate-300"
                                placeholder="John Doe">
                        </div>
                    </div>
                </div>

                <!-- Password Row -->
                <div id="pw-row" class="space-y-2">
                    <label
                        class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                    <div class="relative group">
                        <i data-lucide="lock"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                        <input type="password" id="f-password"
                            class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all placeholder:text-slate-300"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Role -->
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Akses
                            Role</label>
                        <div class="relative group">
                            <i data-lucide="shield"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <select id="f-role" required onchange="onRoleChange()"
                                class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none">
                                <option value="admin">Admin</option>
                                <option value="bk">BK</option>
                                <option value="guru">Guru</option>
                                <option value="kepsek">Kepsek</option>
                                <option value="siswa">Siswa</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Status
                            Akun</label>
                        <div class="relative group">
                            <i data-lucide="check-circle-2"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <select id="f-status"
                                class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none">
                                <option value="aktif">Aktif</option>
                                <option value="nonaktif">Non-Aktif</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <!-- Guru only -->
                <div id="guru-fields" class="hidden space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Kelas
                        Wali</label>
                    <div class="relative group">
                        <i data-lucide="home"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                        <select id="f-kelas-wali"
                            class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all">
                            <option value="">-- Bukan Wali Kelas --</option>
                        </select>
                    </div>
                </div>

                <!-- Siswa only -->
                <div id="siswa-fields" class="hidden space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label
                                class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Kelas</label>
                            <select id="f-kelas"
                                class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all">
                                <option value="">-- Pilih Kelas --</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label
                                class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Nama
                                Orang Tua</label>
                            <input type="text" id="f-nama-ortu"
                                class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Kontak
                            Orang Tua</label>
                        <input type="text" id="f-kontak-ortu"
                            class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all"
                            placeholder="08123456789">
                    </div>
                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Pekerjaan
                            Orang Tua</label>
                        <input type="text" id="f-pekerjaan-ortu"
                            class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all"
                            placeholder="Contoh: Wiraswasta, PNS, dsb.">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Alamat
                            Domisili</label>
                        <textarea id="f-alamat" rows="3"
                            class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all resize-none"></textarea>
                    </div>
                </div>
            </form>

            <!-- Modal Footer -->
            <div
                class="p-8 border-t border-slate-50 bg-slate-50/30 flex items-center justify-end gap-4 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
                <button type="button" onclick="closeModal()"
                    class="px-8 py-4 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-400 hover:text-primary hover:bg-slate-50 transition-all">
                    Batal
                </button>
                <button type="submit" form="user-form" id="modal-submit-btn"
                    class="px-10 py-4 bg-primary text-accent rounded-2xl text-xs font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-xl shadow-primary/10">
                    Simpan Perubahan
                </button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let currentFilter = 'all';

        (async () => {
            const user = await requireLogin();
            if (!user || user.role !== 'admin') { window.location.href = '/dashboard'; return; }
            renderLayout(user);
            loadUsers();
            lucide.createIcons();
        })();

        async function loadUsers() {
            const res = await api(`/api/users?role=${currentFilter}`);
            const tbody = document.getElementById('users-tbody');
            if (!res.ok) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-8 py-20 text-center text-red-500 font-bold">${res.error}</td></tr>`;
                return;
            }

            if (res.data.length === 0) {
                tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="px-8 py-20 text-center">
                        <div class="flex flex-col items-center gap-3 text-slate-300">
                            <i data-lucide="users-2" class="w-12 h-12"></i>
                            <span class="font-bold text-sm uppercase tracking-widest">Tidak ada record user.</span>
                        </div>
                    </td>
                </tr>`;
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = res.data.map(u => `
            <tr class="group hover:bg-slate-50/50 transition-all cursor-pointer" onclick="showDetail(${u.id})">
                <td class="px-8 py-6">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-accent/20 flex items-center justify-center text-primary font-black shadow-xl shadow-accent/5">
                            ${(u.nama_asli || '?').substring(0, 2).toUpperCase()}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <p class="text-sm font-black text-primary tracking-tight">${escapeHtml(u.nama_asli)}</p>
                                ${u.is_self ? '<span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-500 text-[9px] font-black uppercase tracking-tighter">Anda</span>' : ''}
                            </div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">${escapeHtml(u.username)}</p>
                        </div>
                    </div>
                </td>
                <td class="px-8 py-6">
                    <div class="flex items-center gap-3">
                        <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-[10px] font-black uppercase tracking-widest">${u.role}</span>
                        <span class="status-badge ${u.status === 'aktif' ? 'status-aktif' : 'status-nonaktif'}">
                            <span class="w-1.5 h-1.5 rounded-full ${u.status === 'aktif' ? 'bg-emerald-500 shadow-[0_0_8px_bg-emerald-500]' : 'bg-red-500 shadow-[0_0_8px_bg-red-500]'}"></span>
                            ${u.status}
                        </span>
                    </div>
                </td>
                <td class="px-8 py-6">
                    <div class="space-y-1">
                        <p class="text-xs font-bold text-slate-600">${u.last_login ? formatDateTime(u.last_login) : 'Belum pernah login'}</p>
                        <div class="flex items-center gap-1.5">
                            <div class="w-1.5 h-1.5 rounded-full ${u.is_online ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}"></div>
                            <span class="text-[10px] font-bold ${u.is_online ? 'text-emerald-500' : 'text-slate-400'} uppercase tracking-widest">
                                ${u.is_online ? 'Online' : 'Offline'}
                            </span>
                        </div>
                    </div>
                </td>
                <td class="px-8 py-6">
                    <div class="flex items-center justify-center gap-2">
                        <button onclick="event.stopPropagation(); editUser(${u.id})" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-600 hover:bg-primary hover:text-accent transition-all flex items-center justify-center shadow-sm" title="Edit User">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="event.stopPropagation(); resetPw(${u.id})" class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 hover:bg-amber-500 hover:text-white transition-all flex items-center justify-center shadow-sm" title="Reset Password">
                            <i data-lucide="key" class="w-4 h-4"></i>
                        </button>
                        ${!u.is_self ? `
                        <button onclick="event.stopPropagation(); deleteUser(${u.id}, '${escapeHtml(u.username)}')" class="w-10 h-10 rounded-xl bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition-all flex items-center justify-center shadow-sm" title="Hapus User">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>` : ''}
                    </div>
                </td>
            </tr>
        `).join('');
            lucide.createIcons();
        }

        function filterRole(role) {
            currentFilter = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                if (btn.dataset.role === role) {
                    btn.className = 'role-btn role-btn-active';
                } else {
                    btn.className = 'role-btn role-btn-inactive';
                }
            });
            loadUsers();
        }

        function onRoleChange() {
            const role = document.getElementById('f-role').value;
            document.getElementById('guru-fields').classList.toggle('hidden', role !== 'guru');
            document.getElementById('siswa-fields').classList.toggle('hidden', role !== 'siswa');
            lucide.createIcons();
        }

        async function loadKelasOptions(currentVal = '') {
            const selSiswa = document.getElementById('f-kelas');
            const selWali = document.getElementById('f-kelas-wali');
            
            const res = await api('/api/admin/kelass');
            if (res.ok && res.data) {
                const options = res.data.map(k => `<option value="${k.nama_kelas}"${k.nama_kelas === currentVal ? ' selected' : ''}>${k.nama_kelas}</option>`).join('');
                
                selSiswa.innerHTML = '<option value="">-- Pilih Kelas --</option>' + options;
                selWali.innerHTML = '<option value="">-- Bukan Wali Kelas --</option>' + options;
            }
        }

        async function openCreateModal() {
            document.getElementById('modal-title').textContent = 'Tambah User';
            document.getElementById('edit-id').value = '';
            document.getElementById('user-form').reset();
            document.getElementById('pw-row').classList.remove('hidden');
            document.getElementById('f-password').required = true;
            onRoleChange();
            await loadKelasOptions();

            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        async function editUser(id) {
            const res = await api(`/api/users/detail?id=${id}`);
            if (!res.ok) { showAlert(res.error, 'error'); return; }
            const u = res.user;
            const s = res.siswa;

            document.getElementById('modal-title').textContent = 'Edit User';
            document.getElementById('edit-id').value = u.id;
            document.getElementById('f-username').value = u.username;
            document.getElementById('f-nama').value = u.nama_asli;
            document.getElementById('f-password').value = '';
            document.getElementById('f-role').value = u.role;
            document.getElementById('f-status').value = u.status;
            
            // Unconditionally load options before setting value
            await loadKelasOptions();
            
            document.getElementById('f-kelas-wali').value = u.kelas_wali || '';
            document.getElementById('pw-row').classList.add('hidden');
            document.getElementById('f-password').required = false;

            if (s) {
                document.getElementById('f-kelas').value = s.kelas || '';
                document.getElementById('f-alamat').value = s.alamat || '';
                document.getElementById('f-nama-ortu').value = s.nama_orang_tua || '';
                document.getElementById('f-kontak-ortu').value = s.kontak_orang_tua || '';
                document.getElementById('f-pekerjaan-ortu').value = s.pekerjaan_orang_tua || '';
            }

            onRoleChange();
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const isEdit = id !== '';

            const body = {
                username: document.getElementById('f-username').value.trim(),
                nama_asli: document.getElementById('f-nama').value.trim(),
                role: document.getElementById('f-role').value,
                status: document.getElementById('f-status').value,
                kelas_wali: document.getElementById('f-kelas-wali').value.trim(),
                kelas: document.getElementById('f-kelas').value.trim(),
                alamat: document.getElementById('f-alamat').value.trim(),
                nama_orang_tua: document.getElementById('f-nama-ortu').value.trim(),
                kontak_orang_tua: document.getElementById('f-kontak-ortu').value.trim(),
                pekerjaan_orang_tua: document.getElementById('f-pekerjaan-ortu').value.trim(),
            };

            if (isEdit) {
                body.id = parseInt(id);
            } else {
                body.password = document.getElementById('f-password').value;
            }

            const url = isEdit ? '/api/users/update' : '/api/users/create';
            const res = await api(url, { method: 'POST', body });

            if (res.ok) {
                showAlert(isEdit ? 'User berhasil diperbarui!' : 'User berhasil dibuat!', 'success');
                closeModal();
                loadUsers();
            } else {
                showAlert(res.error || 'Gagal menyimpan.', 'error');
            }
        });

        async function deleteUser(id, username) {
            const ok = await customConfirm(
                'modal-del-user', 'modal-del-user-box', 'modal-del-user-msg',
                'modal-del-user-ok', 'modal-del-user-cancel',
                `Hapus user "${username}"? Tindakan ini tidak dapat dibatalkan.`
            );
            if (!ok) return;
            const res = await api('/api/users/delete', { method: 'POST', body: { id } });
            if (res.ok) { showAlert('User berhasil dihapus.', 'success'); loadUsers(); }
            else showAlert(res.error || 'Gagal menghapus.', 'error');
        }

        async function resetPw(id) {
            const pw = await promptModal();
            if (pw === null) return;
            if (!pw) { showAlert('Password tidak boleh kosong.', 'error'); return; }
            const res = await api('/api/users/reset-password', { method: 'POST', body: { id, password: pw } });
            if (res.ok) showAlert('Password berhasil direset.', 'success');
            else showAlert(res.error || 'Gagal mereset password.', 'error');
        }

        function customConfirm(modalId, boxId, msgId, okId, cancelId, message) {
            return new Promise(resolve => {
                const modal = document.getElementById(modalId);
                document.getElementById(msgId).textContent = message;
                modal.classList.remove('hidden');
                setTimeout(() => document.getElementById(boxId).classList.remove('scale-95', 'opacity-0'), 10);
                lucide.createIcons();
                const ok = document.getElementById(okId);
                const cancel = document.getElementById(cancelId);
                function close(val) {
                    document.getElementById(boxId).classList.add('scale-95', 'opacity-0');
                    setTimeout(() => modal.classList.add('hidden'), 300);
                    ok.removeEventListener('click', onOk);
                    cancel.removeEventListener('click', onCancel);
                    resolve(val);
                }
                function onOk() { close(true); }
                function onCancel() { close(false); }
                ok.addEventListener('click', onOk);
                cancel.addEventListener('click', onCancel);
            });
        }

        function promptModal() {
            return new Promise(resolve => {
                const modal = document.getElementById('modal-reset-pw');
                const inp = document.getElementById('modal-reset-pw-input');
                inp.value = '';
                modal.classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('modal-reset-pw-box').classList.remove('scale-95', 'opacity-0');
                    inp.focus();
                }, 10);
                lucide.createIcons();
                const ok = document.getElementById('modal-reset-pw-ok');
                const cancel = document.getElementById('modal-reset-pw-cancel');
                function close(val) {
                    document.getElementById('modal-reset-pw-box').classList.add('scale-95', 'opacity-0');
                    setTimeout(() => modal.classList.add('hidden'), 300);
                    ok.removeEventListener('click', onOk);
                    cancel.removeEventListener('click', onCancel);
                    resolve(val);
                }
                function onOk() { close(inp.value); }
                function onCancel() { close(null); }
                ok.addEventListener('click', onOk);
                cancel.addEventListener('click', onCancel);
                inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') onOk(); });
            });
        }

        function closeDetailModal() {
            document.getElementById('modal-detail-box').classList.add('scale-95', 'opacity-0');
            setTimeout(() => document.getElementById('modal-detail').classList.add('hidden'), 300);
        }

        async function showDetail(id) {
            const res = await api(`/api/users/detail?id=${id}`);
            if (!res.ok) { showAlert(res.error, 'error'); return; }
            const u = res.user;
            const s = res.siswa;
            document.getElementById('detail-avatar').textContent = (u.nama_asli || '?').substring(0, 2).toUpperCase();
            document.getElementById('detail-name').textContent = u.nama_asli;
            document.getElementById('detail-username').textContent = u.username + ' · ' + u.role;
            const roleBadges = { admin: 'bg-purple-50 text-purple-600', bk: 'bg-blue-50 text-blue-600', guru: 'bg-emerald-50 text-emerald-600', kepsek: 'bg-amber-50 text-amber-600', siswa: 'bg-slate-100 text-slate-600' };
            const rb = roleBadges[u.role] || 'bg-slate-100 text-slate-600';
            let html = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-50 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Role</p>
                        <span class="px-3 py-1 rounded-lg text-[11px] font-black uppercase ${rb}">${u.role}</span>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Status</p>
                        <span class="px-3 py-1 rounded-lg text-[11px] font-black uppercase ${u.status === 'aktif' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}">${u.status}</span>
                    </div>
                </div>`;
            if (s) {
                const levels = [
                    { label: 'Hijau (Aman)', color: 'text-emerald-400', icon: 'check-circle' },
                    { label: 'Kuning (Peringatan)', color: 'text-amber-400', icon: 'alert-circle' },
                    { label: 'Merah (Kritis)', color: 'text-red-400', icon: 'alert-triangle' },
                    { label: 'DO (Drop Out)', color: 'text-accent', icon: 'skull' },
                ];
                const stage = levels[s.progress_level] || levels[0];

                html += `
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Data Siswa</p>
                        <a href="/siswa/profil?id=${u.username}" class="px-3 py-1.5 bg-primary text-accent rounded-lg text-[10px] font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all flex items-center gap-1.5 shadow-lg shadow-primary/20">
                            <i data-lucide="external-link" class="w-3 h-3"></i> Profil Detail
                        </a>
                    </div>
                    
                    <div class="flex items-center gap-4 p-4 rounded-2xl bg-gray-900 border border-gray-800 text-white mb-2 shadow-xl">
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-sm ${stage.color}">
                            <i data-lucide="${stage.icon}" class="w-6 h-6"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Status Kedisiplinan</p>
                            <div class="flex items-center justify-between mt-1">
                                <p class="text-sm font-black ${stage.color}">${stage.label}</p>
                                <p class="text-xl font-black text-white">${s.total_poin} <span class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-0.5">Poin</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-4 bg-slate-50 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Kelas</p>
                            <p class="font-black text-primary">${escapeHtml(s.kelas || '-')}</p>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">NIS</p>
                            <p class="font-black text-primary">${escapeHtml(u.username)}</p>
                        </div>
                        <div class="col-span-2 p-4 bg-slate-50 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Orang Tua</p>
                            <p class="font-bold text-primary">${escapeHtml(s.nama_orang_tua || '-')}</p>
                            <p class="text-xs text-slate-400 mt-0.5">${escapeHtml(s.kontak_orang_tua || '-')}</p>
                        </div>
                        ${s.pekerjaan_orang_tua ? `<div class="col-span-2 p-4 bg-slate-50 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Pekerjaan Orang Tua</p>
                            <p class="font-bold text-primary">${escapeHtml(s.pekerjaan_orang_tua)}</p>
                        </div>` : ''}
                        ${s.alamat ? `<div class="col-span-2 p-4 bg-slate-50 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Alamat</p>
                            <p class="font-bold text-primary">${escapeHtml(s.alamat)}</p>
                        </div>` : ''}
                    </div>
                </div>`;
            }
            if (u.role === 'guru' && u.kelas_wali) {
                html += `<div class="p-4 bg-slate-50 rounded-2xl">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Wali Kelas</p>
                    <p class="font-black text-primary">${escapeHtml(u.kelas_wali)}</p>
                </div>`;
            }
            document.getElementById('detail-body').innerHTML = html;
            document.getElementById('detail-edit-btn').onclick = () => { closeDetailModal(); editUser(id); };
            const modal = document.getElementById('modal-detail');
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-detail-box').classList.remove('scale-95', 'opacity-0'), 10);
            lucide.createIcons();
        }
    </script>
</body>

</html>
