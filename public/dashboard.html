<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        /* Active Badge - Lime */
        .badge-active {
            background-color: rgba(196, 241, 104, 0.2);
            color: #0F172A;
        }

        /* Scrollbar styles */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper — sidebar + topbar di-generate oleh renderLayout() -->
    <div id="app"></div>

    <!-- Konten utama halaman dashboard -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">

        <!-- ═══ Greeting ═══ -->
        <div id="greeting" class="mb-8 flex items-center gap-4">
            <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center shadow-lg shadow-primary/10">
                <i data-lucide="layout-dashboard" class="w-6 h-6 text-accent"></i>
            </div>
            <div>
                <h1 class="text-2xl lg:text-3xl font-extrabold text-[#0F172A] tracking-tight">Dashboard</h1>
                <p class="text-[#64748B] text-sm mt-1 font-medium" id="greeting-text">Memuat...</p>
            </div>
        </div>

        <!-- ═══ Stats Cards (4 kolom di desktop) ═══ -->
        <div id="stats-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8"></div>

        <!-- ═══ Two-Column Layout (Admin/BK: pelanggaran + sidebar kanan) ═══ -->
        <div id="two-col" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- Kolom Kiri (2/3) — Alert + Tabel Pelanggaran Terakhir -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Alert Box Pelanggaran -->
                <div id="alert-box"
                    class="bg-white border border-slate-100 rounded-[2rem] p-8 premium-card relative overflow-hidden group">
                    <div
                        class="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-red-50 blur-3xl group-hover:bg-red-100 transition-colors">
                    </div>
                    <div class="flex items-center justify-between relative z-10">
                        <div>
                            <p class="text-5xl font-black text-red-600 tracking-tighter" id="alert-count">0</p>
                            <p class="text-sm text-red-500 mt-2 font-bold uppercase tracking-widest text-[10px]">Total
                                Pelanggaran (30 hari terakhir)</p>
                        </div>
                        <div
                            class="w-16 h-16 bg-red-50 border border-red-100 rounded-2xl flex items-center justify-center">
                            <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500"></i>
                        </div>
                    </div>
                </div>

                <!-- Tabel Pelanggaran Terakhir -->
                <div class="bg-white rounded-[2rem] border border-slate-100 overflow-hidden premium-card">
                    <div class="flex items-center justify-between px-8 py-6 border-b border-slate-50">
                        <h2 class="font-extrabold text-[#0F172A] text-xl tracking-tight">Pelanggaran Terakhir</h2>
                        <button onclick="openAllPelanggaranModal()"
                            class="text-xs font-bold text-accent bg-primary px-4 py-2 rounded-xl hover:bg-slate-800 transition-all border border-primary cursor-pointer">
                            Lihat Semua
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-slate-50 bg-slate-50/30">
                                    <th
                                        class="text-left px-8 py-4 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                        Siswa</th>
                                    <th
                                        class="text-left px-8 py-4 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                        Jenis</th>
                                    <th
                                        class="text-left px-8 py-4 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                        Tanggal</th>
                                    <th
                                        class="text-center px-8 py-4 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                        Poin</th>
                                </tr>
                            </thead>
                            <tbody id="recent-tbody" class="divide-y divide-slate-50">
                                <tr>
                                    <td colspan="4" class="px-8 py-12 text-center text-slate-400">
                                        <div class="flex flex-col items-center gap-2">
                                            <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
                                            <span class="text-sm font-medium">Memuat data...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan (1/3) — Menu Cepat + Log Preview -->
            <div class="space-y-6">
                <!-- Menu Cepat -->
                <div class="bg-white rounded-[2rem] border border-slate-100 p-8 premium-card">
                    <h2 class="font-extrabold text-[#0F172A] text-xl mb-6 tracking-tight">Menu Cepat</h2>
                    <div id="actions-list" class="space-y-3"></div>
                </div>

                <!-- Log Preview -->
                <div class="bg-white rounded-[2rem] border border-slate-100 p-8 premium-card">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="font-extrabold text-[#0F172A] text-xl tracking-tight">Log Terbaru</h2>
                        <i data-lucide="history" class="w-5 h-5 text-slate-300"></i>
                    </div>
                    <div id="log-preview" class="space-y-4">
                        <p class="text-xs text-slate-400">Memuat...</p>
                    </div>
                    <a href="/log"
                        class="inline-flex items-center gap-2 mt-6 text-xs font-bold text-[#64748B] hover:text-primary transition-colors">
                        Buka Log Aktivitas <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- ═══ Simple Quick Actions (Guru/Kepsek — tanpa two-column) ═══ -->
        <div id="simple-actions" class="hidden mb-8">
            <h2 class="text-xl font-extrabold text-[#0F172A] mb-6 tracking-tight">Menu Cepat</h2>
            <div id="simple-actions-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- ═══ Siswa Section (Profil + Riwayat) ═══ -->
        <div id="siswa-section" class="hidden space-y-8">
            <div id="siswa-profil" class="bg-white rounded-[2rem] border border-slate-100 p-8 premium-card"></div>
            <div id="siswa-riwayat" class="bg-white rounded-[2rem] border border-slate-100 p-8 premium-card">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-xl font-extrabold text-[#0F172A] tracking-tight">Riwayat Pelanggaran</h3>
                    <div class="w-10 h-10 bg-accent/20 rounded-xl flex items-center justify-center">
                        <i data-lucide="history" class="w-5 h-5 text-primary"></i>
                    </div>
                </div>
                <div id="riwayat-list" class="space-y-1"></div>
            </div>
        </div>
    </main>

    <!-- Modal Semua Pelanggaran -->
    <div id="modal-all-pelanggaran"
        class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div
            class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col scale-95 opacity-0 transition-all duration-300">
            <div class="p-8 border-b border-slate-50 flex items-center justify-between shrink-0">
                <h2 class="text-xl font-black text-primary tracking-tight">Semua Pelanggaran Terbaru</h2>
                <button onclick="closeAllPelanggaranModal()"
                    class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 flex items-center justify-center transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="overflow-y-auto custom-scrollbar flex-1 relative pb-4">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-100 sticky top-0 bg-white z-10 shadow-sm">
                            <th
                                class="text-left pl-8 pr-4 py-5 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                Siswa</th>
                            <th
                                class="text-left px-4 py-5 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                Jenis Pelanggaran</th>
                            <th
                                class="text-left px-4 py-5 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                Tanggal</th>
                            <th
                                class="text-center pr-8 pl-4 py-5 font-bold text-slate-400 text-[10px] uppercase tracking-widest">
                                Poin</th>
                        </tr>
                    </thead>
                    <tbody id="modal-all-tbody" class="divide-y divide-slate-50">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user) return;
            renderLayout(user);
            lucide.createIcons();

            const res = await api('/api/dashboard');
            if (!res.ok) {
                showAlert(res.error || 'Gagal memuat dashboard.', 'error');
                return;
            }

            const d = res.data;
            document.getElementById('greeting-text').textContent = `Selamat datang kembali, ${d.nama}! 👋`;

            const cardsEl = document.getElementById('stats-cards');

            if (d.role === 'admin') {
                cardsEl.innerHTML = `
                ${statCard('user', 'Total Users', d.total_users, 'blue')}
                ${statCard('zap', 'Online', d.total_online, 'green')}
                ${statCard('graduation-cap', 'Siswa Aktif', d.total_siswa_aktif, 'purple')}
                ${statCard('clipboard-list', 'Jenis Pelanggaran', d.total_jenis, 'orange')}
            `;

                showTwoColumn(d, [
                    quickLink('users', 'Kelola Users', 'Manajemen akun sistem', '/admin/users', 'blue'),
                    quickLink('settings', 'Jenis Pelanggaran', 'Kategori & bobot poin', '/admin/jenis', 'purple'),
                    quickLink('plus-square', 'Input Pelanggaran', 'Catat poin baru', '/pelanggaran/input', 'orange'),
                    quickLink('bar-chart-3', 'Statistik Siswa', 'Analisa data poin', '/bk/stats', 'green'),
                ]);
            }

            if (d.role === 'bk') {
                cardsEl.innerHTML = `
                ${statCard('mail', 'Surat Pending', d.surat_belum ?? 0, 'orange')}
                ${statCard('alert-circle', 'Pelanggaran (30hr)', d.pelanggaran_30_hari ?? 0, 'red')}
                ${statCard('trending-up', 'Akurasi Data', '99%', 'green')}
            `;

                showTwoColumn(d, [
                    quickLink('pen-tool', 'Input Pelanggaran', 'Catat poin baru', '/pelanggaran/input', 'orange'),
                    quickLink('folder-open', 'Kelola Surat', 'Manajemen berkas', '/bk/surat', 'blue'),
                    quickLink('bar-chart-3', 'Statistik Siswa', 'Analisa data poin', '/bk/stats', 'green'),
                ]);
            }

            if (d.role === 'guru') {
                cardsEl.innerHTML = `
                ${statCard('home', 'Kelas Wali', d.kelas_wali || '-', 'green')}
            `;

                const simpleEl = document.getElementById('simple-actions');
                simpleEl.classList.remove('hidden');
                document.getElementById('simple-actions-grid').innerHTML = `
                ${actionCard('pen-tool', 'Input Pelanggaran', 'Catat pelanggaran siswa kelas Anda', '/pelanggaran/input', 'orange')}
                ${actionCard('history', 'Log Aktivitas', 'Lihat riwayat catatan Anda', '/log', 'blue')}
            `;
            }

            if (d.role === 'kepsek') {
                cardsEl.innerHTML = `
                ${statCard('graduation-cap', 'Siswa Aktif', d.total_siswa_aktif ?? 0, 'purple')}
                ${statCard('alert-triangle', 'Pelanggaran 30hr', d.pelanggaran_30_hari ?? 0, 'red')}
            `;

                const simpleEl = document.getElementById('simple-actions');
                simpleEl.classList.remove('hidden');
                document.getElementById('simple-actions-grid').innerHTML = `
                ${actionCard('bar-chart-3', 'Statistik Global', 'Pantau data kedisiplinan', '/bk/stats', 'green')}
                ${actionCard('history', 'Log Aktivitas', 'Audit aktivitas sistem', '/log', 'blue')}
            `;
            }

            if (d.role === 'siswa' && d.siswa) {
                const s = d.siswa;
                const totalPoin = d.total_poin ?? 0;

                cardsEl.innerHTML = `
                ${statCard('target', 'Total Poin', totalPoin, totalPoin >= 30 ? 'red' : totalPoin >= 15 ? 'orange' : 'green')}
                ${statCard('home', 'Kelas', s.kelas || '-', 'blue')}
                ${statCard('activity', 'Status Level', ['Hijau', 'Kuning', 'Merah', 'DO'][s.progress_level] || 'Hijau', ['green', 'orange', 'red', 'gray'][s.progress_level] || 'green')}
            `;

                const detail = await api(`/api/siswa/detail?id=${s.id_siswa}`);
                if (detail.ok) {
                    document.getElementById('siswa-section').classList.remove('hidden');
                    const si = detail.siswa;
                    document.getElementById('siswa-profil').innerHTML = `
                    <div class="flex items-center gap-4 mb-8">
                        <div class="w-16 h-16 rounded-full bg-accent flex items-center justify-center text-primary font-black text-2xl shadow-xl shadow-accent/20">
                            ${(si.nama || '?').substring(0, 1)}
                        </div>
                        <div>
                            <h3 class="text-2xl font-black text-primary tracking-tight">${escapeHtml(si.nama)}</h3>
                            <p class="text-slate-500 font-bold text-xs uppercase tracking-widest">NIS: ${escapeHtml(si.nis)} • Kelas: ${escapeHtml(si.kelas)}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="p-6 rounded-2xl bg-slate-50 border border-slate-100 group hover:border-accent transition-all">
                            <span class="text-slate-400 text-[10px] font-black uppercase tracking-widest block mb-1">Nama Lengkap</span>
                            <p class="font-bold text-primary">${escapeHtml(si.nama)}</p>
                        </div>
                        <div class="p-6 rounded-2xl bg-slate-50 border border-slate-100 group hover:border-accent transition-all">
                            <span class="text-slate-400 text-[10px] font-black uppercase tracking-widest block mb-1">Jurusan / Kelas</span>
                            <p class="font-bold text-primary">${escapeHtml(si.kelas)}</p>
                        </div>
                        <div class="p-6 rounded-2xl bg-slate-50 border border-slate-100 group hover:border-accent transition-all">
                            <span class="text-slate-400 text-[10px] font-black uppercase tracking-widest block mb-1">Wali Siswa</span>
                            <p class="font-bold text-primary">${escapeHtml(si.nama_orang_tua || '—')}</p>
                        </div>
                    </div>
                `;

                    const historyHtml = (detail.history || []).map(h => `
                    <div class="flex items-center justify-between p-6 rounded-2xl hover:bg-slate-50 transition-all group">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center text-red-500 group-hover:bg-red-500 group-hover:text-white transition-all">
                                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-primary tracking-tight">${escapeHtml(h.nama_jenis)}</p>
                                <p class="text-[11px] font-semibold text-slate-400">${formatDate(h.tanggal)}${h.keterangan ? ' • ' + escapeHtml(h.keterangan) : ''}</p>
                            </div>
                        </div>
                        <div class="px-4 py-2 rounded-xl bg-red-50 text-red-600 font-black text-sm">
                            +${h.poin}
                        </div>
                    </div>
                `).join('');

                    document.getElementById('riwayat-list').innerHTML = historyHtml || `
                    <div class="text-center py-20 bg-slate-50 rounded-3xl border border-dashed border-slate-200">
                        <i data-lucide="award" class="w-12 h-12 text-slate-200 mx-auto mb-3"></i>
                        <p class="text-slate-400 font-bold">Belum ada pelanggaran tercatat. Luar biasa! 🎉</p>
                    </div>`;
                    lucide.createIcons();
                }
            }
            lucide.createIcons();
        })();

        async function showTwoColumn(d, quickLinks) {
            const twoCol = document.getElementById('two-col');
            twoCol.classList.remove('hidden');
            twoCol.classList.add('grid');

            document.getElementById('alert-count').textContent = d.pelanggaran_30_hari ?? 0;
            document.getElementById('actions-list').innerHTML = quickLinks.join('');

            const logRes = await api('/api/log');
            if (logRes.ok && logRes.data.length > 0) {
                const logEl = document.getElementById('log-preview');
                logEl.innerHTML = logRes.data.slice(0, 5).map(l => {
                    const dotClass = {
                        'tambah_pelanggaran': 'bg-red-500',
                        'hapus_pelanggaran': 'bg-amber-400',
                        'naik_level': 'bg-purple-500',
                    }[l.aksi] || 'bg-blue-500';

                    return `
                    <div class="flex items-start gap-3">
                        <div class="w-1.5 h-1.5 rounded-full ${dotClass} mt-2.5 shadow-[0_0_8px] shadow-current"></div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs text-primary font-bold leading-relaxed truncate group-hover:text-clip overflow-hidden">${escapeHtml(l.actor_nama || '?')} — ${escapeHtml(l.aksi)}</p>
                            <p class="text-[10px] text-slate-400 font-medium">${formatDateTime(l.created_at)}</p>
                        </div>
                    </div>
                `;
                }).join('');
            }

            const pelRes = await api('/api/pelanggaran/recent');
            const tbody = document.getElementById('recent-tbody');
            if (pelRes.ok && pelRes.data && pelRes.data.length > 0) {
                tbody.innerHTML = pelRes.data.slice(0, 10).map(p => `
                <tr class="group hover:bg-slate-50/50 transition-all">
                    <td class="px-8 py-5">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-accent flex items-center justify-center text-primary text-xs font-black shadow-lg shadow-accent/10">
                                ${escapeHtml((p.nama_siswa || '?').substring(0, 2).toUpperCase())}
                            </div>
                            <div>
                                <p class="text-sm font-bold text-primary tracking-tight">${escapeHtml(p.nama_siswa)}</p>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${escapeHtml(p.nis || '')}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-5 text-sm font-semibold text-slate-600">${escapeHtml(p.nama_jenis)}</td>
                    <td class="px-8 py-5 text-xs font-bold text-slate-400">${formatDate(p.tanggal)}</td>
                    <td class="px-8 py-5 text-center">
                        <span class="inline-flex items-center justify-center px-3 py-1.5 rounded-xl bg-red-50 text-red-600 font-black text-xs">
                            +${p.poin}
                        </span>
                    </td>
                </tr>
            `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="px-8 py-20 text-center text-slate-400 font-medium italic">Belum ada pelanggaran terbaru.</td></tr>';
            }
            lucide.createIcons();
        }

        function statCard(iconName, label, value, color) {
            const colorMap = {
                blue: 'text-blue-600 bg-blue-50/50 border-blue-100',
                green: 'text-emerald-600 bg-emerald-50/50 border-emerald-100',
                red: 'text-red-600 bg-red-50/50 border-red-100',
                orange: 'text-orange-600 bg-orange-50/50 border-orange-100',
                purple: 'text-purple-600 bg-purple-50/50 border-purple-100',
                gray: 'text-slate-600 bg-slate-50/50 border-slate-100'
            };
            const c = colorMap[color] || colorMap.green;
            return `
            <div class="bg-white rounded-[2rem] border border-slate-100 p-8 premium-card relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-24 h-24 rounded-full bg-accent/20 blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${c} border shadow-inner">
                            <i data-lucide="${iconName}" class="w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] leading-none">${label}</span>
                    </div>
                    <p class="text-4xl font-black tracking-tighter text-primary">${value}</p>
                </div>
            </div>
        `;
        }

        function quickLink(iconName, title, desc, href, color) {
            return `
            <a href="${href}" class="group flex items-center gap-4 p-4 rounded-2xl hover:bg-accent/10 transition-all border border-transparent hover:border-accent/30 bg-slate-50/30">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm group-hover:bg-primary transition-all border border-slate-100 group-hover:border-primary">
                    <i data-lucide="${iconName}" class="w-6 h-6 text-primary group-hover:text-accent transition-colors"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-black text-primary tracking-tight">${title}</p>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">${desc}</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-primary group-hover:translate-x-1 transition-all"></i>
            </a>
        `;
        }

        function actionCard(iconName, title, desc, href, color) {
            return `
            <a href="${href}" class="block bg-white rounded-[2rem] border border-slate-100 p-8 premium-card group relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-24 h-24 rounded-full bg-accent/10 blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                <div class="flex items-center gap-4 mb-4 relative z-10">
                    <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center border border-slate-100 group-hover:bg-accent group-hover:border-accent transition-all">
                        <i data-lucide="${iconName}" class="w-6 h-6 text-primary"></i>
                    </div>
                </div>
                <h3 class="font-black text-primary mb-2 text-xl tracking-tight relative z-10">${title}</h3>
                <p class="text-sm font-medium text-slate-500 relative z-10">${desc}</p>
            </a>
        `;
        }

        async function openAllPelanggaranModal() {
            const modal = document.getElementById('modal-all-pelanggaran');
            const tbody = document.getElementById('modal-all-tbody');

            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('div:first-child').classList.remove('scale-95', 'opacity-0'), 10);

            tbody.innerHTML = '<tr><td colspan="4" class="px-8 py-12 text-center text-slate-400"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Memuat data...</td></tr>';
            lucide.createIcons();

            const res = await api('/api/pelanggaran/recent?limit=50');
            if (res.ok && res.data && res.data.length > 0) {
                tbody.innerHTML = res.data.map(p => `
                    <tr class="hover:bg-slate-50/50 transition-all">
                        <td class="pl-8 pr-4 py-4">
                            <p class="text-sm font-bold text-primary">${escapeHtml(p.nama_siswa)}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${escapeHtml(p.nis || '')}</p>
                        </td>
                        <td class="px-4 py-4 text-sm font-semibold text-slate-600">${escapeHtml(p.nama_jenis)}</td>
                        <td class="px-4 py-4 text-xs font-bold text-slate-400">${formatDate(p.tanggal)}</td>
                        <td class="pr-8 pl-4 py-4 text-center">
                            <span class="inline-flex items-center justify-center px-3 py-1 bg-red-50 text-red-600 font-black text-xs rounded-xl border border-red-100">
                                +${p.poin}
                            </span>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="px-8 py-12 text-center text-slate-400 italic">Belum ada pelanggaran tercatat.</td></tr>';
            }
            lucide.createIcons();
        }

        function closeAllPelanggaranModal() {
            const modal = document.getElementById('modal-all-pelanggaran');
            modal.querySelector('div:first-child').classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    </script>
</body>


</html>
