<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Aktivitas — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper -->
    <div id="app"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-2xl shadow-primary/20">
                    <i data-lucide="scroll-text" class="w-7 h-7 text-accent"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Log Aktivitas</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Audit trail sistem & monitoring tindakan pengguna
                    </p>
                </div>
            </div>
            <div class="px-5 py-2.5 bg-white rounded-2xl border border-slate-100 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none">Live Audit
                    Sync</span>
            </div>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-50 bg-slate-50/30">
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Waktu & Audit</th>
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Aksi Tindakan</th>
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Pelaku (Actor)</th>
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Subjek (Student)</th>
                            <th
                                class="text-left px-8 py-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">
                                Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="log-tbody" class="divide-y divide-slate-50">
                        <tr>
                            <td colspan="5" class="px-8 py-20 text-center text-slate-400">
                                <div class="flex flex-col items-center gap-3">
                                    <div
                                        class="w-12 h-12 border-4 border-accent border-t-primary rounded-full animate-spin">
                                    </div>
                                    <span class="font-bold text-sm tracking-widest uppercase">Sinkronisasi data
                                        log...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user) return;
            renderLayout(user);

            const res = await api('/api/log');
            const tbody = document.getElementById('log-tbody');

            if (!res.ok) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-8 py-20 text-center text-red-500 font-bold italic">${res.error}</td></tr>`;
                return;
            }

            if (res.data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-8 py-20 text-center">
                            <div class="flex flex-col items-center gap-3 text-slate-300">
                                <i data-lucide="database" class="w-12 h-12"></i>
                                <span class="font-bold text-sm uppercase tracking-widest">Belum ada riwayat audit log.</span>
                            </div>
                        </td>
                    </tr>`;
                lucide.createIcons();
                return;
            }

            const aksiBadge = {
                'tambah_pelanggaran': { text: 'Tambah Pelanggaran', class: 'bg-red-50 text-red-600 border-red-100', icon: 'plus-circle' },
                'hapus_pelanggaran': { text: 'Hapus Pelanggaran', class: 'bg-amber-50 text-amber-600 border-amber-100', icon: 'trash-2' },
                'naik_level': { text: 'Naik Level', class: 'bg-purple-50 text-purple-600 border-purple-100', icon: 'trending-up' },
                'verifikasi_do': { text: 'Verifikasi DO', class: 'bg-gray-100 text-gray-700 border-gray-200', icon: 'shield-check' },
                'reset_password': { text: 'Reset Password', class: 'bg-blue-50 text-blue-600 border-blue-100', icon: 'key' },
            };

            tbody.innerHTML = res.data.map(l => {
                const badge = aksiBadge[l.aksi] || { text: l.aksi.replace(/_/g, ' '), class: 'bg-slate-100 text-slate-600 border-slate-200', icon: 'activity' };
                return `
                <tr class="group hover:bg-slate-50/50 transition-all">
                    <td class="px-8 py-6 whitespace-nowrap">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-primary group-hover:text-white transition-all">
                                <i data-lucide="clock" class="w-4 h-4"></i>
                            </div>
                            <span class="text-[11px] font-bold text-slate-500 tabular-nums uppercase tracking-tighter cursor-default">${formatDateTime(l.created_at)}</span>
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest border ${badge.class} shadow-sm">
                            <i data-lucide="${badge.icon}" class="w-3 h-3"></i>
                            ${badge.text}
                        </span>
                    </td>
                    <td class="px-8 py-6">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs font-black text-slate-400">
                                ${escapeHtml(l.actor_nama || '?').charAt(0)}
                            </div>
                            <div>
                                <p class="text-sm font-bold text-primary tracking-tight">${escapeHtml(l.actor_nama || '-')}</p>
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${l.actor_role || ''}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        ${l.siswa_nama ? `
                            <a href="/siswa/profil?id=${l.siswa_nis}" class="group/link flex items-center gap-2">
                                <div class="w-7 h-7 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 group-hover/link:bg-blue-500 group-hover/link:text-white transition-all">
                                    <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
                                </div>
                                <span class="text-sm font-bold text-blue-600 hover:text-blue-700 transition-colors">${escapeHtml(l.siswa_nama)}</span>
                            </a>
                        ` : '<span class="text-xs text-slate-300 italic">N/A</span>'}
                    </td>
                    <td class="px-8 py-6">
                        <p class="text-xs text-slate-500 font-medium max-w-xs line-clamp-2" title="${escapeHtml(l.alasan || '')}">
                            ${escapeHtml(l.alasan || '-')}
                        </p>
                    </td>
                </tr>
            `;
            }).join('');
            lucide.createIcons();
        })();
    </script>
</body>

</html>
