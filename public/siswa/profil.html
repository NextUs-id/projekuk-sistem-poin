<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Siswa — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper -->
    <div id="app"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-2xl shadow-primary/20">
                    <i data-lucide="user-square" class="w-7 h-7 text-accent"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Profil Siswa</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Data akademik & riwayat kedisiplinan</p>
                </div>
            </div>
            <div id="quick-stats" class="hidden md:flex items-center gap-3">
                <!-- Data poin ringkas di sini -->
            </div>
        </div>

        <!-- Profil Card -->
        <div id="profil-card" class="bg-white rounded-[2.5rem] border border-slate-100 p-8 md:p-10 mb-10 premium-card">
            <div class="flex items-center gap-4 py-10">
                <div class="w-12 h-12 border-4 border-accent border-t-primary rounded-full animate-spin"></div>
                <span class="font-bold text-sm tracking-widest uppercase text-slate-400">Memuat profil...</span>
            </div>
        </div>

        <!-- Riwayat Pelanggaran -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card mb-10">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <h2 class="text-sm font-black text-primary uppercase tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-slate-400"></i>
                    Riwayat Pelanggaran
                </h2>
                <div class="px-3 py-1 bg-white rounded-lg border border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest"
                    id="riwayat-count">
                    - Records
                </div>
            </div>
            <div id="riwayat-list">
                <div class="flex items-center gap-4 p-20 justify-center">
                    <div class="w-12 h-12 border-4 border-accent border-t-primary rounded-full animate-spin"></div>
                </div>
            </div>
        </div>

        <!-- Riwayat Surat & Dokumen -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <h2 class="text-sm font-black text-primary uppercase tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i>
                    Surat Pernyataan & Dokumen
                </h2>
            </div>
            <div id="surat-list">
                <div class="flex items-center gap-4 p-20 justify-center">
                    <div class="w-12 h-12 border-4 border-accent border-t-primary rounded-full animate-spin"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Print Preview Modal -->
    <div id="print-modal"
        class="hidden fixed inset-0 z-[100] flex items-start justify-center bg-primary/20 backdrop-blur-md p-4 overflow-y-auto pt-10 transition-all duration-300">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-2xl scale-95 opacity-0 transition-all duration-300 mb-10 overflow-hidden"
            id="modal-content">
            <div class="flex items-center justify-between p-8 border-b border-slate-50 bg-slate-50/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center">
                        <i data-lucide="printer" class="w-6 h-6 text-accent"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-primary tracking-tight">Cetak Dokumen</h2>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Salinan Resmi Digital</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="doPrint()"
                        class="px-6 py-3 bg-primary text-accent rounded-xl text-xs font-black uppercase tracking-widest hover:scale-105 transition-all shadow-lg shadow-primary/10">
                        Cetak / Save PDF
                    </button>
                    <button onclick="closePrint()"
                        class="w-12 h-12 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all flex items-center justify-center">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="print-content" class="p-12 overflow-x-auto">
                <!-- Content here is for display only -->
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user) return;
            renderLayout(user);

            let idSiswa = '';

            if (user.role !== 'siswa') {
                const params = new URLSearchParams(window.location.search);
                idSiswa = params.get('id') || '';
                if (!idSiswa) {
                    document.getElementById('profil-card').innerHTML = `<div class="p-10 text-center text-red-500 font-bold bg-red-50 rounded-3xl border border-red-100 italic">Error: ID siswa tidak valid.</div>`;
                    return;
                }
            }

            const url = user.role === 'siswa' ? '/api/siswa/detail' : `/api/siswa/detail?id=${idSiswa}`;
            const res = await api(url);

            if (!res.ok) {
                document.getElementById('profil-card').innerHTML = `<div class="p-10 text-center text-red-500 font-bold bg-red-50 rounded-3xl border border-red-100 italic">${res.error}</div>`;
                return;
            }

            const s = res.siswa;
            const totalPoin = res.total_poin;
            const history = res.history || [];

            // Stats
            const qs = document.getElementById('quick-stats');
            qs.classList.remove('hidden');
            qs.innerHTML = `<div class="px-5 py-2.5 bg-primary rounded-2xl flex flex-col items-end shadow-xl shadow-primary/10"><span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Akumulasi Poin</span><span class="text-xl font-black text-accent">${totalPoin}</span></div>`;

            // Profil Card
            document.getElementById('profil-card').innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-10">
                    <div class="flex items-center gap-8">
                        <div class="w-24 h-24 md:w-32 md:h-32 rounded-[2.5rem] bg-slate-50 flex items-center justify-center border-4 border-white shadow-2xl shadow-slate-200/50 relative">
                            <span class="text-4xl md:text-5xl font-black text-primary">${escapeHtml(s.nama.charAt(0)).toUpperCase()}</span>
                            <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-accent rounded-2xl flex items-center justify-center shadow-lg border-4 border-white">
                                <i data-lucide="graduation-cap" class="w-5 h-5 text-primary"></i>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center gap-3 flex-wrap">
                                <h2 class="text-2xl md:text-4xl font-black text-primary tracking-tight leading-tight">${escapeHtml(s.nama)}</h2>
                                ${levelBadge(s.progress_level)}
                            </div>
                            <p class="text-sm font-bold text-slate-400 uppercase tracking-[0.2em] mt-2 flex items-center gap-2"><span class="text-primary font-black">ID#</span> ${escapeHtml(s.nis)}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 md:w-auto w-full">
                        <div class="bg-slate-50/50 p-5 rounded-3xl border border-slate-100 md:min-w-[160px]">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Kelas Program</p>
                            <p class="text-lg font-black text-primary">${escapeHtml(s.kelas)}</p>
                        </div>
                        <div class="bg-slate-50/50 p-5 rounded-3xl border border-slate-100 md:min-w-[160px]">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Status Poin</p>
                            <p class="text-lg font-black ${totalPoin >= 30 ? 'text-red-500' : 'text-emerald-500'}">${totalPoin} Poin</p>
                        </div>
                    </div>
                </div>
            `;

            // Riwayat Pelanggaran
            const rl = document.getElementById('riwayat-list');
            document.getElementById('riwayat-count').textContent = `${history.length} RECORDS`;
            if (history.length === 0) {
                rl.innerHTML = `<div class="px-8 py-20 text-center flex flex-col items-center gap-4"><div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center shadow-xl shadow-emerald-500/10"><i data-lucide="party-popper" class="w-10 h-10"></i></div><p class="text-sm font-medium text-slate-500 mt-1">Belum ada pelanggaran tercatat. Pertahankan prestasimu!</p></div>`;
            } else {
                rl.innerHTML = `
                    <div class="overflow-x-auto"><table class="w-full text-sm">
                        <thead><tr class="bg-slate-50/50">
                            <th class="text-left px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Record</th>
                            <th class="text-center px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Poin</th>
                            <th class="text-left px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Keterangan</th>
                        </tr></thead>
                        <tbody class="divide-y divide-slate-50">
                            ${history.map(h => `<tr class="group hover:bg-slate-50/30 transition-all"><td class="px-8 py-6"><p class="text-sm font-black text-primary tracking-tight">${escapeHtml(h.nama_jenis)}</p><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">${formatDate(h.tanggal)}</p></td><td class="px-8 py-6 text-center"><span class="px-3 py-1 bg-red-50 text-red-500 rounded-lg text-xs font-black">+${h.poin}</span></td><td class="px-8 py-6"><p class="text-xs text-slate-600 leading-relaxed font-medium">${escapeHtml(h.keterangan || '-')}</p></td></tr>`).join('')}
                        </tbody>
                    </table></div>`;
            }

            // Riwayat Surat & Dokumen
            const sl = document.getElementById('surat-list');
            const suratRes = await api(`/api/siswa/surat?id=${s.id_siswa}`);
            if (!suratRes.ok || !suratRes.data.length) {
                sl.innerHTML = `<div class="px-8 py-20 text-center flex flex-col items-center gap-4"><i data-lucide="file-x" class="w-12 h-12 text-slate-200"></i><p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Belum ada surat pernyataan atau dokumen resmi.</p></div>`;
            } else {
                sl.innerHTML = `
                    <div class="overflow-x-auto"><table class="w-full text-sm">
                        <thead><tr class="bg-slate-50/50 text-left">
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Dokumen</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Nomor Surat</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Tanggal</th>
                            <th class="text-center px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Aksi</th>
                        </tr></thead>
                        <tbody class="divide-y divide-slate-50">
                            ${suratRes.data.map(doc => {
                                const labels = { perjanjian: 'Surat Perjanjian', pemanggilan: 'Pemanggilan Ortu', do: 'Surat DO', pindah: 'Surat Pindah' };
                                const icons = { perjanjian: 'file-signature', pemanggilan: 'mail', do: 'alert-octagon', pindah: 'log-out' };
                                const label = labels[doc.jenis] || 'Dokumen';
                                const icon = icons[doc.jenis] || 'file-text';
                                
                                return `
                                <tr class="group hover:bg-slate-50/30 transition-all">
                                    <td class="px-8 py-6">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center">
                                                <i data-lucide="${icon}" class="w-4 h-4 text-primary"></i>
                                            </div>
                                            <span class="text-sm font-black text-primary tracking-tight">${label}</span>
                                        </div>
                                    </td>
                                    <td class="px-8 py-6"><span class="text-[11px] font-black text-blue-600 font-mono tracking-tight">${escapeHtml(doc.nomor || '-')}</span></td>
                                    <td class="px-8 py-6"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${doc.tanggal}</span></td>
                                    <td class="px-8 py-6"><div class="flex justify-center"><button onclick="openPrint(${doc.id}, '${doc.jenis}')" class="w-10 h-10 rounded-xl bg-primary text-accent flex items-center justify-center hover:scale-110 transition-all shadow-sm"><i data-lucide="external-link" class="w-4 h-4"></i></button></div></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table></div>`;
            }
            lucide.createIcons();
        })();

        async function openPrint(id, jenis) {
            let endpoint = '';
            if (jenis === 'perjanjian') endpoint = `/api/surat/perjanjian/print?id=${id}`;
            else if (jenis === 'pemanggilan') endpoint = `/api/surat/pemanggilan/print?id=${id}`;
            else if (jenis === 'do') endpoint = `/api/surat/do/print?id=${id}`;
            else if (jenis === 'pindah') endpoint = `/api/surat/pindah/print?id=${id}`;
            else endpoint = `/api/surat/perjanjian/print?id=${id}`; // Fallback

            const res = await api(endpoint);
            if (!res.ok) { showAlert(res.error, 'error'); return; }

            const s = res.surat;
            const p = res.pejabat;
            const kepsek = p['Kepala Sekolah'] || { nama_pejabat: '-', nip: '-' };
            const bk = p['Guru BK'] || { nama_pejabat: '-', nip: '-' };
            const kesiswaan = p['Wakasek Kesiswaan'] || { nama_pejabat: '-', nip: '-' };

            const content = document.getElementById('print-content');

            if (jenis === 'perjanjian_siswa' || jenis === 'perjanjian_ortu') {
                const progKeahlian = s.program_keahlian || '...................................................';
                const masalahDisplay = (s.isi_perjanjian || s.ortu_masalah || '...................................................').replace(/\n/g, '<br>&nbsp;&nbsp;');

                content.innerHTML = `
                    <div style="font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.5; color: #000; background: #fff; padding: 0; min-width: 650px;">
                        <img src="/bk/kop-surat.jpg" style="width: 100%; height: auto; margin-bottom: 5px;">
                        <div style="text-align: center; font-weight: bold; font-size: 18px; margin: 10px 0 20px 0; text-transform: uppercase;">SURAT PERNYATAAN SISWA</div>
                        <p style="margin-bottom: 5px;">Yang bertandatangan di bawah ini :</p>
                        <table style="width: 100%; margin-left: 20px; border-collapse: collapse;">
                            <tr><td style="width: 150px; padding-left: 20px;">Nama</td><td>: <strong>${escapeHtml(s.nama)}</strong></td></tr>
                            <tr><td style="padding-left: 20px;">NIS</td><td>: ${escapeHtml(s.nis)}</td></tr>
                            <tr><td style="padding-left: 20px;">Kelas</td><td>: ${escapeHtml(s.kelas)}</td></tr>
                            <tr><td style="padding-left: 20px;">Program Keahlian</td><td>: ${escapeHtml(progKeahlian)}</td></tr>
                            <tr><td style="padding-left: 20px; vertical-align: top;">Masalah</td><td style="vertical-align: top;">: ${escapeHtml(masalahDisplay).replace(/\n/g, '<br>&nbsp;&nbsp;')}</td></tr>
                        </table>
                        <table style="width: 100%; margin-left: 20px; margin-top: 10px; border-collapse: collapse;">
                            <tr><td style="width: 150px; padding-left: 20px;">Nama Orang Tua</td><td>: ${escapeHtml(s.ortu_nama || '...................................................') }</td></tr>
                            <tr><td style="padding-left: 20px;">Pekerjaan</td><td>: ${escapeHtml(s.ortu_pekerjaan || '...................................................') }</td></tr>
                            <tr><td style="padding-left: 20px;">Alamat Rumah</td><td>: ${escapeHtml(s.ortu_alamat || '...................................................') }</td></tr>
                            <tr><td style="padding-left: 20px;">No. Hp./Telp.</td><td>: ${escapeHtml(s.ortu_hp || '...................................................') }</td></tr>
                        </table>
                        <p style="text-align: justify; margin-top: 15px; text-indent: 10px;">Menyatakan dan berjanji akan bersungguh-sungguh berubah dan bersedia mentaati aturan dan tata tertib sekolah...</p>
                        <table style="width: 100%; margin-top: 30px; text-align: left; border-collapse: collapse;">
                            <tr>
                                <td style="width: 50%; vertical-align: top; padding-bottom: 20px;">
                                    Mengetahui,<br>Orang Tua/Wali siswa<br><br><br><br><br>.......................................................
                                </td>
                                <td style="width: 50%; vertical-align: top; padding-bottom: 20px; padding-left: 50px;">
                                    Denpasar, ${escapeHtml(s.tanggal_perjanjian || '........................')}<br>Siswa yang bersangkutan<br><br><br><br><br><strong>${escapeHtml(s.nama)}</strong>
                                </td>
                            </tr>
                            <tr>
                                <td style="width: 50%; vertical-align: top; padding-top: 20px;">
                                    Guru Bimbingan Konseling<br><br><br><br><br><u>${escapeHtml(bk.nama_pejabat)}</u>
                                </td>
                                <td style="width: 50%; vertical-align: top; padding-top: 20px; padding-left: 50px;">
                                     Guru Wali Kelas<br><br><br><br><br>.......................................................
                                </td>
                            </tr>
                        </table>
                        <div style="text-align: center; margin-top: 15px;">
                            Mengetahui<br>Wakasek Kesiswaan<br><br><br><br><br><u>${escapeHtml(kesiswaan.nama_pejabat)}</u>
                        </div>
                    </div>`;
            } else if (jenis === 'pemanggilan') {
                content.innerHTML = `
                    <div style="font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.5; color: #000; background: #fff; padding: 20px; min-width: 600px;">
                        <img src="/bk/kop-surat.jpg" style="width: 100%; height: auto; margin-bottom: 20px;">
                        
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                            <tr>
                                <td style="width: 70px;">No.</td>
                                <td>: ${escapeHtml(s.nomor || '-')}</td>
                            </tr>
                            <tr>
                                <td>Lamp.</td>
                                <td>: -</td>
                            </tr>
                            <tr>
                                <td>Perihal</td>
                                <td>: Pemanggilan Orang Tua / Wali Siswa</td>
                            </tr>
                        </table>

                        <p style="margin: 0;">Kepada</p>
                        <p style="margin: 0;">Yth. Bapak/ Ibu</p>
                        <table style="width: 100%; border-collapse: collapse; margin-left: 20px; margin-bottom: 15px;">
                            <tr>
                                <td style="width: 150px;">Orang Tua / Wali dari</td>
                                <td>: <strong>${escapeHtml(s.nama)}</strong></td>
                            </tr>
                            <tr>
                                <td>Kelas / Nis</td>
                                <td>: ${escapeHtml(s.kelas)} / ${escapeHtml(s.nis)}</td>
                            </tr>
                        </table>

                        <p style="margin-bottom: 5px;">Dengan hormat,</p>
                        <p style="margin-top: 0; margin-bottom: 10px;">Bersama surat ini, kami mengharapkan kehadiran Bapak / Ibu pada :</p>
                        <table style="width: 100%; border-collapse: collapse; margin-left: 20px; margin-bottom: 15px;">
                            <tr>
                                <td style="width: 150px;">Hari / Tanggal</td>
                                <td>: ${escapeHtml(s.hari_tanggal || '-')}</td>
                            </tr>
                            <tr>
                                <td>Pukul</td>
                                <td>: ${escapeHtml(s.pukul || '-')}</td>
                            </tr>
                            <tr>
                                <td>Tempat</td>
                                <td>: ${escapeHtml(s.tempat || '-')}</td>
                            </tr>
                            <tr>
                                <td style="vertical-align: top;">Keperluan</td>
                                <td style="vertical-align: top;">: ${escapeHtml(s.keperluan || '-').replace(/\n/g, '<br>&nbsp;&nbsp;')}</td>
                            </tr>
                        </table>

                        <p style="text-align: justify; text-indent: 30px; margin-bottom: 40px;">Demikian surat ini kami sampaikan, besar harapan kami pertemuan ini agar tidak diwakilkan. Atas perhatian dan kerjasamanya, kami ucapkan terimakasih.</p>

                        <div style="margin-top: 30px; width: 100%; display: table;">
                            <div style="display: table-row;">
                                <div style="display: table-cell; width: 50%; vertical-align: bottom; padding-bottom: 10px;">
                                    <div style="text-align: left; margin-left: 0;">
