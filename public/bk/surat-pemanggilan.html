<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Pemanggilan Ortu — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper generated by js -->
    <div id="app"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-2xl shadow-primary/20">
                    <i data-lucide="send" class="w-7 h-7 text-accent"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Surat Pemanggilan</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Korespondensi resmi kehadiran wali murid ke
                        sekolah</p>
                </div>
            </div>
            <div class="px-5 py-2.5 bg-white rounded-2xl border border-slate-100 flex items-center gap-2 shadow-sm">
                <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                <span
                    class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none">Auto-Numbering
                    Active</span>
            </div>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 md:p-10 mb-10 premium-card">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-primary"></i>
                </div>
                <h3 class="text-xl font-black text-primary tracking-tight uppercase tracking-[0.1em]">Buat Surat Baru
                </h3>
            </div>

            <form id="form-pemanggilan" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Siswa
                            Tujuan</label>
                        <div class="relative group">
                            <i data-lucide="user"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <select id="f-siswa" required
                                class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none cursor-pointer">
                                <option value="">— Pilih Siswa —</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Tanggal
                            Surat</label>
                        <div class="relative group">
                            <i data-lucide="calendar"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="date" id="f-tanggal" required
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all cursor-pointer">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Hari /
                            Tanggal Hadir</label>
                        <div class="relative group">
                            <i data-lucide="clock"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="text" id="f-hari" placeholder="Senin, 12 Feb 2026"
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Waktu
                            (Pukul)</label>
                        <div class="relative group">
                            <i data-lucide="timer"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="text" id="f-pukul" placeholder="09:00 WITA"
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Tempat
                            Pertemuan</label>
                        <div class="relative group">
                            <i data-lucide="map-pin"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="text" id="f-tempat" placeholder="Ruang BK"
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Keperluan
                        & Agenda</label>
                    <div class="relative group">
                        <i data-lucide="info"
                            class="absolute left-4 top-6 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                        <textarea id="f-keperluan" rows="2"
                            class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all resize-none"
                            placeholder="Membahas perkembangan perilaku siswa..."></textarea>
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit"
                        class="px-10 py-4 bg-primary text-accent rounded-2xl text-xs font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-xl shadow-primary/10">
                        Generate Nomor & Simpan
                    </button>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-sm font-black text-primary uppercase tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-slate-400"></i>
                    Arsip Pemanggilan
                </h3>
            </div>
            <div id="table-container" class="overflow-x-auto min-h-[200px]">
                <div class="flex flex-col items-center justify-center p-20 gap-3">
                    <div class="w-10 h-10 border-4 border-accent border-t-primary rounded-full animate-spin"></div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Retrieving
                        archives...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Print Preview Modal -->
    <div id="print-modal"
        class="hidden fixed inset-0 z-[100] flex items-start justify-center bg-primary/20 backdrop-blur-md p-4 overflow-y-auto pt-10 transition-all duration-300">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-2xl scale-95 opacity-0 transition-all duration-300 mb-10 overflow-hidden"
            id="modal-content">
            <div class="flex items-center justify-between p-8 border-b border-slate-50 bg-slate-50/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center">
                        <i data-lucide="printer" class="w-6 h-6 text-accent"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-primary tracking-tight">Cetak Dokumen</h2>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Formal Invitation
                            Format</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="doPrint()"
                        class="px-6 py-3 bg-primary text-accent rounded-xl text-xs font-black uppercase tracking-widest hover:scale-105 transition-all shadow-lg shadow-primary/10">
                        Cetak
                    </button>
                    <button onclick="closePrint()"
                        class="w-12 h-12 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all flex items-center justify-center">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="print-content" class="p-12 overflow-x-auto">
                <!-- Content here is for display only -->
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user || !['admin', 'bk'].includes(user.role)) { window.location.href = '/dashboard'; return; }
            renderLayout(user);

            document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);

            const eligRes = await api('/api/surat/siswa-eligible?level=0,1&min_poin=30');
            if (eligRes.ok) {
                const sel = document.getElementById('f-siswa');
                eligRes.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id_siswa;
                    opt.textContent = `${s.nis} — ${s.nama} (${s.kelas}) [Poin: ${s.total_poin}]`;
                    sel.appendChild(opt);
                });
            }

            loadList();

            document.getElementById('form-pemanggilan').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.submitter;
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...';
                lucide.createIcons();

                const body = {
                    id_siswa: parseInt(document.getElementById('f-siswa').value),
                    tanggal_surat: document.getElementById('f-tanggal').value,
                    hari_tanggal: document.getElementById('f-hari').value.trim(),
                    pukul: document.getElementById('f-pukul').value.trim(),
                    tempat: document.getElementById('f-tempat').value.trim(),
                    keperluan: document.getElementById('f-keperluan').value.trim(),
                };
                if (!body.id_siswa) { showAlert('Pilih siswa terlebih dahulu.', 'error'); btn.disabled = false; btn.textContent = originalText; return; }

                const res = await api('/api/surat/pemanggilan', { method: 'POST', body });
                btn.disabled = false;
                btn.textContent = originalText;
                lucide.createIcons();

                if (res.ok) {
                    showAlert(`${res.message} (Nomor: ${res.nomor})`, 'success');
                    document.getElementById('form-pemanggilan').reset();
                    document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);
                    loadList();
                } else {
                    showAlert(res.error, 'error');
                }
            });
        })();

        async function loadList() {
            const res = await api('/api/surat/pemanggilan');
            const el = document.getElementById('table-container');
            if (!res.ok || !res.data.length) {
                el.innerHTML = `
                    <div class="px-8 py-20 text-center flex flex-col items-center gap-3">
                        <i data-lucide="file-x" class="w-12 h-12 text-slate-200"></i>
                        <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Belum ada history pemanggilan.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }
            el.innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50/50 text-left">
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Reference No</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Siswa / Kelas</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Tgl Terbit</th>
                            <th class="text-center px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        ${res.data.map(s => `
                            <tr class="group hover:bg-slate-50/30 transition-all">
                                <td class="px-8 py-6">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                                            <i data-lucide="hash" class="w-3.5 h-3.5 text-blue-500"></i>
                                        </div>
                                        <span class="text-[11px] font-black text-blue-600 font-mono tracking-tight">${escapeHtml(s.nomor || '-')}</span>
                                    </div>
                                </td>
                                <td class="px-8 py-6">
                                    <p class="text-sm font-black text-primary tracking-tight">${escapeHtml(s.nama)}</p>
                                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-0.5">${escapeHtml(s.kelas)}</p>
                                </td>
                                <td class="px-8 py-6">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest tabular-nums">${s.tanggal_surat}</span>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="flex justify-center">
                                        <button onclick="openPrint(${s.id})" class="w-10 h-10 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center hover:bg-primary hover:text-white transition-all shadow-sm">
                                            <i data-lucide="printer" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            lucide.createIcons();
        }

        async function openPrint(id) {
            const res = await api(`/api/surat/pemanggilan/print?id=${id}`);
            if (!res.ok) { showAlert(res.error, 'error'); return; }

            const s = res.surat;
            const p = res.pejabat;
            const kepsek = p['Kepala Sekolah'] || { nama_pejabat: '-', nip: '-' };

            document.getElementById('print-content').innerHTML = `
                <div style="font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.8; color: #000; background: #fff; padding: 20px; border: 1px solid #eee; min-width: 600px;">
                    <div style="text-align: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 3px double #000;">
                        <h2 style="font-size: 20px; font-weight: bold; margin: 0; text-transform: uppercase;">SURAT PEMANGGILAN ORANG TUA / WALI MURID</h2>
                        <p style="margin: 4px 0; font-size: 13px;">Nomor: ${escapeHtml(s.nomor || '-')}</p>
                    </div>

                    <p>Dengan hormat,</p>
                    <p>Sehubungan dengan diperlukannya koordinasi pembinaan siswa, kami mengundang Bapak/Ibu selaku orang tua/wali dari:</p>

                    <table style="margin: 20px 0 20px 32px; border-collapse: collapse;">
                        <tr><td style="padding: 4px 16px 4px 0; width: 140px;">Nama Siswa</td><td>: <strong>${escapeHtml(s.nama)}</strong></td></tr>
                        <tr><td style="padding: 4px 16px 4px 0;">NIS</td><td>: ${escapeHtml(s.nis)}</td></tr>
                        <tr><td style="padding: 4px 16px 4px 0;">Kelas</td><td>: ${escapeHtml(s.kelas)}</td></tr>
                    </table>

                    <p>Untuk hadir di sekolah guna melakukan pertemuan pada:</p>
                    <table style="margin: 20px 0 20px 32px; border-collapse: collapse; background: #fcfcfc; border: 1px solid #eee; width: 80%;">
                        <tr><td style="padding: 8px 16px; width: 140px; border-bottom: 1px solid #f0f0f0;">Hari / Tanggal</td><td style="padding: 8px 16px; border-bottom: 1px solid #f0f0f0;">: ${escapeHtml(s.hari_tanggal || '-')}</td></tr>
                        <tr><td style="padding: 8px 16px; border-bottom: 1px solid #f0f0f0;">Pukul</td><td style="padding: 8px 16px; border-bottom: 1px solid #f0f0f0;">: ${escapeHtml(s.pukul || '-')}</td></tr>
                        <tr><td style="padding: 8px 16px; border-bottom: 1px solid #f0f0f0;">Tempat</td><td style="padding: 8px 16px; border-bottom: 1px solid #f0f0f0;">: ${escapeHtml(s.tempat || '-')}</td></tr>
                        <tr><td style="padding: 8px 16px;">Keperluan</td><td style="padding: 8px 16px;">: ${escapeHtml(s.keperluan || '-')}</td></tr>
                    </table>

                    <p>Demikian surat ini kami sampaikan. Kehadiran Bapak/Ibu sangat kami harapkan demi kebaikan dan kelancaran pendidikan putra/putri Bapak/Ibu.</p>

                    <div style="margin-top: 60px; text-align: right; padding-right: 40px;">
                        <p>Denpasar, ${s.tanggal_surat}</p>
                        <p style="margin-top: 12px;">Kepala Sekolah,</p>
                        <div style="height: 100px;"></div>
                        <p><strong><u>${escapeHtml(kepsek.nama_pejabat)}</u></strong></p>
                        <p>NIP. ${escapeHtml(kepsek.nip)}</p>
                    </div>
                </div>
            `;

            const modal = document.getElementById('print-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
            lucide.createIcons();
        }

        function closePrint() {
            const modal = document.getElementById('print-modal');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function doPrint() {
            const content = document.getElementById('print-content').innerHTML;
            const win = window.open('', '_blank');
            win.document.write(`<html><head><title>Cetak Surat Pemanggilan</title><style>body{font-family:'Times New Roman',serif;padding:40px;} @media print{body{padding:20px;}} table{border-collapse:collapse;}</style></head><body>${content}</body></html>`);
            win.document.close();
            win.print();
        }
    </script>
</body>

</html>
