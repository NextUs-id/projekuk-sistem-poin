<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .progress-bar-glow {
            box-shadow: 0 0 15px currentColor;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-indigo-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-purple-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper generated by js -->
    <div id="app"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-indigo-600/20 rotate-3 group hover:rotate-0 transition-transform duration-300">
                    <i data-lucide="bar-chart-3" class="w-7 h-7 text-white"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Statistik Pelanggaran</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Analitik kedisiplinan dan trend perilaku siswa
                    </p>
                </div>
            </div>
            <div class="px-5 py-2.5 bg-white rounded-2xl border border-slate-100 flex items-center gap-2 shadow-sm">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none">Live
                    Analytics Active</span>
            </div>
        </div>

        <!-- Summary Cards -->
        <div id="stats-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <!-- Loading States -->
            ${[1,2,3,4].map(() => `
            <div class="bg-white rounded-3xl border border-slate-50 p-6 premium-card animate-pulse">
                <div class="w-10 h-10 bg-slate-50 rounded-xl mb-4"></div>
                <div class="h-4 w-20 bg-slate-50 rounded mb-2"></div>
                <div class="h-8 w-12 bg-slate-50 rounded"></div>
            </div>
            `).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <!-- Pelanggaran per Kategori -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 md:p-10 premium-card">
                    <div class="flex items-center gap-3 mb-10">
                        <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center">
                            <i data-lucide="layers" class="w-5 h-5 text-indigo-600"></i>
                        </div>
                        <h3 class="text-xl font-black text-primary tracking-tight uppercase tracking-[0.1em]">Distribusi
                            Kategori</h3>
                    </div>
                    <div id="kategori-bars" class="space-y-8 min-h-[300px]">
                        <div class="flex flex-col items-center justify-center h-full pt-10 gap-3">
                            <i data-lucide="loader-2" class="w-8 h-8 text-indigo-200 animate-spin"></i>
                            <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Aggregating
                                records...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Siswa Top Poin -->
            <div class="space-y-6">
                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 premium-card">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-10 h-10 rounded-xl bg-rose-50 flex items-center justify-center">
                            <i data-lucide="award" class="w-5 h-5 text-rose-600"></i>
                        </div>
                        <h2 class="text-lg font-black text-primary tracking-tight">Urutan Poin Tertinggi</h2>
                    </div>
                    <div id="top-siswa" class="space-y-4">
                        <div class="flex flex-col items-center justify-center p-10 gap-2">
                            <div class="w-6 h-6 border-2 border-slate-100 border-t-rose-500 rounded-full animate-spin">
                            </div>
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Ranking
                                students...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user || !['admin', 'bk', 'kepsek'].includes(user.role)) { window.location.href = '/dashboard'; return; }
            renderLayout(user);

            // Load data
            const [siswaRes, jenisRes] = await Promise.all([
                api('/api/siswa'),
                api('/api/jenis'),
            ]);

            const siswaList = siswaRes.ok ? siswaRes.data : [];
            const jenisList = jenisRes.ok ? jenisRes.data : [];

            // Summary cards
            const totalPakai = jenisList.reduce((s, j) => s + (parseInt(j.jumlah_pakai) || 0), 0);
            const cards = document.getElementById('stats-cards');
            cards.innerHTML = `
                <div class="bg-white rounded-3xl border border-slate-50 p-6 premium-card group overflow-hidden relative">
                    <div class="absolute -right-4 -top-4 w-20 h-20 bg-indigo-50 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                    <div class="relative z-10">
                        <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center mb-4 group-hover:rotate-6 transition-transform">
                            <i data-lucide="users" class="w-6 h-6 text-indigo-600"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Populasi</p>
                        <p class="text-3xl font-black text-primary tracking-tighter tabular-nums">${siswaList.length}</p>
                        <p class="text-[10px] font-bold text-indigo-400 mt-2 uppercase tracking-widest">Siswa Terdaftar</p>
                    </div>
                </div>
                <div class="bg-white rounded-3xl border border-slate-50 p-6 premium-card group overflow-hidden relative">
                    <div class="absolute -right-4 -top-4 w-20 h-20 bg-purple-50 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                    <div class="relative z-10">
                        <div class="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center mb-4 group-hover:rotate-6 transition-transform">
                            <i data-lucide="clipboard-list" class="w-6 h-6 text-purple-600"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Entri Katalog</p>
                        <p class="text-3xl font-black text-primary tracking-tighter tabular-nums">${jenisList.length}</p>
                        <p class="text-[10px] font-bold text-purple-400 mt-2 uppercase tracking-widest">Jenis Pelanggaran</p>
                    </div>
                </div>
                <div class="bg-white rounded-3xl border border-slate-50 p-6 premium-card group overflow-hidden relative">
                    <div class="absolute -right-4 -top-4 w-20 h-20 bg-rose-50 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                    <div class="relative z-10">
                        <div class="w-12 h-12 bg-rose-50 rounded-2xl flex items-center justify-center mb-4 group-hover:rotate-6 transition-transform">
                            <i data-lucide="activity" class="w-6 h-6 text-rose-600"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Insiden</p>
                        <p class="text-3xl font-black text-primary tracking-tighter tabular-nums">${totalPakai}</p>
                        <p class="text-[10px] font-bold text-rose-400 mt-2 uppercase tracking-widest">Terakumulasi</p>
                    </div>
                </div>
                <div class="bg-white rounded-3xl border border-slate-50 p-6 premium-card group overflow-hidden relative">
                    <div class="absolute -right-4 -top-4 w-20 h-20 bg-emerald-50 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                    <div class="relative z-10">
                        <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center mb-4 group-hover:rotate-6 transition-transform">
                            <i data-lucide="check-circle" class="w-6 h-6 text-emerald-600"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Sistem Health</p>
                        <p class="text-3xl font-black text-primary tracking-tighter tabular-nums">99%</p>
                        <p class="text-[10px] font-bold text-emerald-400 mt-2 uppercase tracking-widest">Data Integrity</p>
                    </div>
                </div>
            `;
            lucide.createIcons();

            // Kategori bars
            const katBars = document.getElementById('kategori-bars');
            const byKat = {};
            jenisList.forEach(j => {
                const k = j.kode_kategori || 'LAIN';
                if (!byKat[k]) byKat[k] = { count: 0 };
                byKat[k].count += parseInt(j.jumlah_pakai) || 0;
            });

            const maxCount = Math.max(...Object.values(byKat).map(v => v.count), 1);
            const katLabels = { SS: 'Seragam & Atribut', KS: 'Kehadiran & Disiplin', PBM: 'Proses Belajar', PNN: 'Perilaku Negatif', PB: 'Bullying / Intimidasi', KB: 'Kebersihan Lingkungan', UB: 'Upacara Bendera', LAIN: 'Lain-lain' };
            const katColors = { SS: 'bg-blue-500', KS: 'bg-amber-500', PBM: 'bg-indigo-500', PNN: 'bg-rose-500', PB: 'bg-purple-500', KB: 'bg-emerald-500', UB: 'bg-sky-500', LAIN: 'bg-slate-500' };

            katBars.innerHTML = Object.entries(byKat).sort((a, b) => b[1].count - a[1].count).map(([k, v]) => `
                <div class="group">
                    <div class="flex items-center justify-between text-sm mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full ${katColors[k] || 'bg-slate-400'}"></div>
                            <span class="font-bold text-primary tracking-tight whitespace-nowrap">${katLabels[k] || k}</span>
                        </div>
                        <div class="flex items-center gap-2">
                             <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${v.count} entri</span>
                             <span class="px-1.5 py-0.5 rounded-md bg-slate-50 text-slate-400 text-[9px] font-black tracking-widest tabular-nums">${(v.count / maxCount * 100).toFixed(0)}%</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-50 rounded-full h-3 overflow-hidden shadow-inner flex relative">
                        <div class="${katColors[k] || 'bg-slate-400'} h-full rounded-full transition-all duration-1000 ease-out flex items-center justify-end pr-2 overflow-hidden shadow-lg shadow-black/5" style="width: 0%" id="bar-${k}">
                        </div>
                    </div>
                </div>
            `).join('');

            // Trigge animation
            setTimeout(() => {
                Object.entries(byKat).forEach(([k, v]) => {
                    const el = document.getElementById(`bar-${k}`);
                    if (el) el.style.width = `${(v.count / maxCount * 100).toFixed(1)}%`;
                });
            }, 100);

            if (Object.keys(byKat).length === 0) {
                katBars.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 gap-3 grayscale opacity-30">
                        <i data-lucide="box" class="w-12 h-12 text-slate-300"></i>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">No categorical data available</span>
                    </div>`;
                lucide.createIcons();
            }

            // Top siswa
            const topEl = document.getElementById('top-siswa');
            if (siswaList.length === 0) {
                topEl.innerHTML = `
                    <div class="py-10 text-center flex flex-col items-center gap-2">
                        <i data-lucide="user-x" class="w-10 h-10 text-slate-100"></i>
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Zero student record</span>
                    </div>`;
                lucide.createIcons();
            } else {
                const topN = siswaList.slice(0, 10);
                const details = await Promise.all(topN.map(s => api(`/api/siswa/detail?id=${s.id_siswa}`)));

                const ranked = details
                    .filter(d => d.ok)
                    .map(d => ({ nama: d.siswa.nama, nis: d.siswa.nis, kelas: d.siswa.kelas, poin: d.total_poin, level: d.siswa.progress_level }))
                    .sort((a, b) => b.poin - a.poin);

                topEl.innerHTML = ranked.map((s, i) => `
                    <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50/50 border border-slate-50 hover:bg-white hover:border-slate-100 hover:shadow-lg hover:shadow-black/5 transition-all group">
                        <div class="flex items-center gap-4">
                            <span class="w-8 h-8 rounded-xl ${i < 3 ? 'bg-primary text-white' : 'bg-white text-slate-400'} text-xs flex items-center justify-center font-black group-hover:scale-110 transition-transform">
                                ${i + 1}
                            </span>
                            <div>
                                <p class="text-xs font-black text-primary tracking-tight leading-none">${escapeHtml(s.nama)}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">${escapeHtml(s.kelas)}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <p class="text-sm font-black ${s.poin >= 30 ? 'text-rose-600' : 'text-primary'} tabular-nums leading-none">${s.poin}</p>
                                <p class="text-[8px] font-black text-slate-300 uppercase tracking-widest mt-0.5">PTS</p>
                            </div>
                            <div class="w-1.5 h-1.5 rounded-full ${s.level === 0 ? 'bg-emerald-500' : s.level === 1 ? 'bg-amber-500' : 'bg-rose-500'}"></div>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        })();
    </script>
</body>

</html>
