<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurangan Poin — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-sky-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper generated by js -->
    <div id="app"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-sky-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-sky-600/20 rotate-3 group hover:rotate-0 transition-transform duration-300">
                    <i data-lucide="minus-circle" class="w-7 h-7 text-white"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Pengurangan Poin</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Reward dan pemutihan poin kedisiplinan siswa</p>
                </div>
            </div>
            <div class="px-5 py-2.5 bg-sky-50 rounded-2xl border border-sky-100 flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></div>
                <span class="text-[10px] font-black text-sky-600 uppercase tracking-widest leading-none">Credit
                    Management System</span>
            </div>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 md:p-10 mb-10 premium-card">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-sky-50 flex items-center justify-center">
                    <i data-lucide="edit-3" class="w-5 h-5 text-sky-600"></i>
                </div>
                <h3 class="text-xl font-black text-primary tracking-tight uppercase tracking-[0.1em]">Input Pengurangan
                </h3>
            </div>

            <form id="form-pengurangan" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Nama
                            Siswa</label>
                        <div class="relative group">
                            <i data-lucide="user"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-sky-500 transition-colors"></i>
                            <select id="f-siswa" required
                                class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-sky-400 focus:ring-4 focus:ring-sky-400/10 outline-none transition-all appearance-none cursor-pointer">
                                <option value="">— Pilih Siswa —</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Tgl
                            Transaksi</label>
                        <div class="relative group">
                            <i data-lucide="calendar"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-sky-500 transition-colors"></i>
                            <input type="date" id="f-tanggal" required
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-sky-400 focus:ring-4 focus:ring-sky-400/10 outline-none transition-all cursor-pointer">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Total
                            Poin Diskon</label>
                        <div class="relative group">
                            <i data-lucide="minus"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-sky-500 transition-colors"></i>
                            <input type="number" id="f-jumlah" min="1" required placeholder="Contoh: 10"
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-sky-400 focus:ring-4 focus:ring-sky-400/10 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Keterangan
                        / Alasan Reward</label>
                    <div class="relative group">
                        <i data-lucide="message-square"
                            class="absolute left-4 top-6 w-4 h-4 text-slate-300 group-focus-within:text-sky-500 transition-colors"></i>
                        <textarea id="f-ket" rows="2"
                            class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-sky-400 focus:ring-4 focus:ring-sky-400/10 outline-none transition-all resize-none"
                            placeholder="Alasan pemutihan atau pengurangan poin..."></textarea>
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit"
                        class="px-10 py-5 bg-sky-600 text-white rounded-2xl text-xs font-black uppercase tracking-widest hover:bg-sky-700 hover:scale-105 active:scale-95 transition-all shadow-xl shadow-sky-600/20">
                        Simpan Record Transaksi
                    </button>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-sm font-black text-primary uppercase tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-slate-400"></i>
                    Audit Log Pengurangan
                </h3>
            </div>
            <div id="table-container" class="overflow-x-auto min-h-[200px]">
                <div class="flex flex-col items-center justify-center p-20 gap-3">
                    <div class="w-10 h-10 border-4 border-sky-400 border-t-sky-600 rounded-full animate-spin"></div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Compiling
                        history...</span>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user || !['admin', 'bk'].includes(user.role)) { window.location.href = '/dashboard'; return; }
            renderLayout(user);

            document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);

            const siswaRes = await api('/api/siswa');
            if (siswaRes.ok) {
                const sel = document.getElementById('f-siswa');
                siswaRes.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id_siswa;
                    opt.textContent = `${s.nis} — ${s.nama} (${s.kelas})`;
                    sel.appendChild(opt);
                });
            }

            loadList();

            document.getElementById('form-pengurangan').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...';
                lucide.createIcons();

                const body = {
                    id_siswa: parseInt(document.getElementById('f-siswa').value),
                    tanggal: document.getElementById('f-tanggal').value,
                    jumlah_pengurangan: parseInt(document.getElementById('f-jumlah').value),
                    keterangan: document.getElementById('f-ket').value.trim(),
                };
                if (!body.id_siswa) { showAlert('Pilih siswa.', 'error'); btn.disabled = false; btn.textContent = originalText; return; }

                const res = await api('/api/surat/pengurangan', { method: 'POST', body });
                btn.disabled = false;
                btn.textContent = originalText;
                lucide.createIcons();

                if (res.ok) {
                    showAlert(res.message, 'success');
                    document.getElementById('form-pengurangan').reset();
                    document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);
                    loadList();
                } else {
                    showAlert(res.error, 'error');
                }
            });
        })();

        async function loadList() {
            const res = await api('/api/surat/pengurangan');
            const el = document.getElementById('table-container');
            if (!res.ok || !res.data.length) {
                el.innerHTML = `
                    <div class="px-8 py-20 text-center flex flex-col items-center gap-3">
                        <i data-lucide="info" class="w-12 h-12 text-slate-200"></i>
                        <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Belum ada catatan pengurangan poin.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }
            el.innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50/50 text-left">
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Ref ID</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Identitas Siswa</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Tgl Audit</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Jumlah</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Justifikasi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        ${res.data.map((s, i) => `
                            <tr class="group hover:bg-sky-50/20 transition-all">
                                <td class="px-8 py-6">
                                    <span class="w-7 h-7 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-[10px] font-black text-slate-400">#${i + 1}</span>
                                </td>
                                <td class="px-8 py-6">
                                    <p class="text-sm font-black text-primary tracking-tight">${escapeHtml(s.nama)}</p>
                                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">NIS: ${escapeHtml(s.nis)}</p>
                                </td>
                                <td class="px-8 py-6">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest tabular-nums">${s.tanggal}</span>
                                </td>
                                <td class="px-8 py-6">
                                    <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-600 text-[10px] font-black tracking-widest">-${s.jumlah_pengurangan}</span>
                                </td>
                                <td class="px-8 py-6">
                                    <p class="text-[11px] font-medium text-slate-500 max-w-xs line-clamp-2" title="${escapeHtml(s.keterangan || '-')}">${escapeHtml(s.keterangan || '-')}</p>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            lucide.createIcons();
        }
    </script>
</body>

</html>
