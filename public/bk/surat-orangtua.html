<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Orang Tua — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper generated by js -->
    <div id="app"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-2xl shadow-primary/20">
                    <i data-lucide="mail" class="w-7 h-7 text-accent"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Surat Orang Tua</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Panggilan resmi & komunikasi kedisiplinan wali
                        murid</p>
                </div>
            </div>
            <div class="px-5 py-2.5 bg-emerald-50 rounded-2xl border border-emerald-100 flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4 text-emerald-500"></i>
                <span class="text-[9px] font-black text-emerald-600 uppercase tracking-widest leading-none">Status
                    "Terkirim" otomatis update level</span>
            </div>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 md:p-10 mb-10 premium-card">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-primary"></i>
                </div>
                <h3 class="text-xl font-black text-primary tracking-tight uppercase tracking-[0.1em]">Buat Surat Baru
                </h3>
            </div>

            <form id="form-orangtua" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-1 space-y-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Siswa
                            Teridentifikasi</label>
                        <div class="relative group">
                            <i data-lucide="user-minus"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <select id="f-siswa" required
                                class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none cursor-pointer">
                                <option value="">— Pilih Siswa —</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Tanggal
                            Cetak</label>
                        <div class="relative group">
                            <i data-lucide="calendar"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <input type="date" id="f-tanggal" required
                                class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all cursor-pointer">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Initial
                            Status</label>
                        <div class="relative group">
                            <i data-lucide="send-to-back"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                            <select id="f-status" required
                                class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none cursor-pointer">
                                <option value="Belum Terkirim">Belum Terkirim</option>
                                <option value="Pending">Pending</option>
                                <option value="Terkirim">Terkirim</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end pt-4">
                    <button type="submit"
                        class="px-10 py-4 bg-primary text-accent rounded-2xl text-xs font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-xl shadow-primary/10">
                        Proses Surat Baru
                    </button>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden premium-card">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-sm font-black text-primary uppercase tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="layers" class="w-4 h-4 text-slate-400"></i>
                    Registry Surat Terbit
                </h3>
            </div>
            <div id="table-container" class="overflow-x-auto min-h-[200px]">
                <div class="flex flex-col items-center justify-center p-20 gap-3">
                    <div class="w-10 h-10 border-4 border-accent border-t-primary rounded-full animate-spin"></div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Accessing
                        logs...</span>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            const user = await requireLogin();
            if (!user || !['admin', 'bk'].includes(user.role)) { window.location.href = '/dashboard'; return; }
            renderLayout(user);

            document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);

            const eligRes = await api('/api/surat/siswa-eligible?level=0,1&min_poin=30');
            if (eligRes.ok) {
                const sel = document.getElementById('f-siswa');
                eligRes.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id_siswa;
                    opt.textContent = `${s.nis} — ${s.nama} (${s.kelas}) [Poin: ${s.total_poin}]`;
                    sel.appendChild(opt);
                });
            }

            loadList();

            document.getElementById('form-orangtua').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.submitter;
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...';
                lucide.createIcons();

                const body = {
                    id_siswa: parseInt(document.getElementById('f-siswa').value),
                    tanggal_cetak: document.getElementById('f-tanggal').value,
                    status_kirim: document.getElementById('f-status').value,
                };
                if (!body.id_siswa) { showAlert('Pilih siswa terlebih dahulu.', 'error'); btn.disabled = false; btn.textContent = originalText; return; }

                const res = await api('/api/surat/orangtua', { method: 'POST', body });
                btn.disabled = false;
                btn.textContent = originalText;
                lucide.createIcons();

                if (res.ok) {
                    showAlert(res.message, 'success');
                    document.getElementById('f-siswa').value = '';
                    loadList();
                } else {
                    showAlert(res.error, 'error');
                }
            });
        })();

        async function loadList() {
            const res = await api('/api/surat/orangtua');
            const el = document.getElementById('table-container');
            if (!res.ok || !res.data.length) {
                el.innerHTML = `
                    <div class="px-8 py-20 text-center flex flex-col items-center gap-3">
                        <i data-lucide="inbox" class="w-12 h-12 text-slate-200"></i>
                        <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Belum ada history panggilan orang tua.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }
            el.innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50/50 text-left">
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Audit No</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Student Identity</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Tgl Cetak</th>
                            <th class="px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Dispatch Status</th>
                            <th class="text-center px-8 py-4 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        ${res.data.map((s, i) => `
                            <tr class="group hover:bg-slate-50/30 transition-all">
                                <td class="px-8 py-6">
                                    <span class="w-7 h-7 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-[10px] font-black text-slate-400">#${i + 1}</span>
                                </td>
                                <td class="px-8 py-6">
                                    <p class="text-sm font-black text-primary tracking-tight">${escapeHtml(s.nama)}</p>
                                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none mt-1">${escapeHtml(s.kelas)}</p>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-300"></i>
                                        <span class="text-[11px] font-bold text-slate-500 tabular-nums">${s.tanggal_cetak}</span>
                                    </div>
                                </td>
                                <td class="px-8 py-6">
                                    ${statusBadge(s.status_kirim)}
                                </td>
                                <td class="px-8 py-6">
                                    <div class="flex justify-center">
                                        <div class="relative group/select">
                                            <select onchange="updateStatus(${s.id_surat_orangtua}, this.value)" 
                                                class="pl-4 pr-10 py-2.5 rounded-xl border border-slate-100 bg-white text-[10px] font-black uppercase tracking-widest text-primary hover:border-accent focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none cursor-pointer shadow-sm">
                                                ${['Belum Terkirim', 'Pending', 'Terkirim', 'Batal Terkirim'].map(st => `<option value="${st}" ${s.status_kirim === st ? 'selected' : ''}>${st}</option>`).join('')}
                                            </select>
                                            <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none"></i>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            lucide.createIcons();
        }

        function statusBadge(status) {
            const colors = {
                'Terkirim': 'bg-emerald-50 text-emerald-600 border-emerald-100',
                'Pending': 'bg-amber-50 text-amber-600 border-amber-100',
                'Belum Terkirim': 'bg-slate-50 text-slate-500 border-slate-100',
                'Batal Terkirim': 'bg-red-50 text-red-600 border-red-100',
            };
            const icons = {
                'Terkirim': 'check-circle-2',
                'Pending': 'clock',
                'Belum Terkirim': 'archive',
                'Batal Terkirim': 'x-circle',
            };
            const icon = icons[status] || 'activity';
            return `
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest border ${colors[status] || 'bg-slate-50'} shadow-sm">
                    <i data-lucide="${icon}" class="w-3 h-3"></i>
                    ${status}
                </span>`;
        }

        async function updateStatus(idSurat, newStatus) {
            const isTerkirim = newStatus === 'Terkirim';
            if (isTerkirim && !confirm('Setting status "Terkirim" akan menaikkan level pembinaan siswa. Lanjutkan?')) {
                loadList();
                return;
            }

            const res = await api('/api/surat/orangtua/status', {
                method: 'POST',
                body: { id_surat_orangtua: idSurat, status_kirim: newStatus },
            });
            if (res.ok) {
                showAlert(res.message, 'success');
                loadList();
            } else {
                showAlert(res.error, 'error');
                loadList(); // revert
            }
        }
    </script>
</body>

</html>
