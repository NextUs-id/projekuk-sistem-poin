<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Surat — SMK TI Bali Global Denpasar</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.12);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <div class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"></div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10" style="animation-delay: 2s;"></div>

    <div id="app"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center shadow-2xl shadow-primary/20">
                    <i data-lucide="folder-key" class="w-7 h-7 text-accent"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-primary tracking-tight">Kelola Surat</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Terbitkan surat penurunan poin siswa</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-5 py-2.5 bg-white rounded-2xl border border-slate-100 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nexus Active</span>
            </div>
        </div>

        <div id="siswa-list" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="lg:col-span-2 py-20 text-center">
                <div class="flex flex-col items-center gap-3">
                    <div class="w-12 h-12 border-4 border-accent border-t-primary rounded-full animate-spin"></div>
                    <span class="font-bold text-sm tracking-widest uppercase text-slate-400">Memuat data...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Konfirmasi -->
    <div id="modal-confirm" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div id="modal-confirm-content" class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md scale-95 opacity-0 transition-all duration-300 overflow-hidden">
            <div class="p-8 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center">
                        <i data-lucide="alert-triangle" class="w-6 h-6 text-amber-600"></i>
                    </div>
                    <div>
                        <h2 id="confirm-title" class="text-xl font-black text-primary">Konfirmasi</h2>
                        <p id="confirm-jenis" class="text-[10px] font-bold text-slate-400 uppercase"></p>
                    </div>
                </div>
                <button onclick="closeConfirmModal()" class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-8 text-center">
                <p id="confirm-message" class="text-sm font-medium text-slate-600"></p>
            </div>
            <div class="p-8 pt-0 flex gap-4">
                <button onclick="closeConfirmModal()" class="flex-1 px-6 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">
                    Batal
                </button>
                <button onclick="proceedTerbit()" class="flex-1 px-6 py-4 rounded-2xl text-xs font-black uppercase bg-primary text-accent hover:scale-105 transition-all shadow-xl">
                    Ya, Terbitkan
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Sukses -->
    <div id="modal-success" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-primary/20 backdrop-blur-md p-4">
        <div id="modal-success-content" class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md scale-95 opacity-0 transition-all duration-300 overflow-hidden">
            <div class="p-8 border-b border-slate-50 flex items-center justify-between bg-emerald-50/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center">
                        <i data-lucide="check-circle" class="w-6 h-6 text-emerald-600"></i>
                    </div>
                    <div>
                        <h2 id="success-title" class="text-xl font-black text-primary">Berhasil!</h2>
                        <p class="text-[10px] font-bold text-emerald-500 uppercase">Surat Diterbitkan</p>
                    </div>
                </div>
                <button onclick="closeSuccessModal()" class="w-10 h-10 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-8 text-center">
                <p id="success-message" class="text-sm font-medium text-slate-600"></p>
            </div>
            <div class="p-8 pt-0 flex gap-4">
                <button onclick="closeSuccessModal()" class="flex-1 px-6 py-4 rounded-2xl text-xs font-black uppercase bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">
                    Tutup
                </button>
                <button id="btn-cetak" onclick="cetakDariSukses()" class="hidden flex-1 px-6 py-4 rounded-2xl text-xs font-black uppercase bg-primary text-accent hover:scale-105 transition-all shadow-xl flex items-center justify-center gap-2">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    Cetak Surat
                </button>
            </div>
        </div>
    </div>

    <!-- Print Modal -->
    <div id="print-modal" class="hidden fixed inset-0 z-[100] flex items-start justify-center bg-primary/20 backdrop-blur-md p-4 overflow-y-auto pt-10 transition-all duration-300">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-2xl scale-95 opacity-0 transition-all duration-300 mb-10 overflow-hidden" id="print-modal-content">
            <div class="flex items-center justify-between p-8 border-b border-slate-50 bg-slate-50/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center">
                        <i data-lucide="printer" class="w-6 h-6 text-accent"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-primary tracking-tight">Cetak Dokumen</h2>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Digital Official Copy</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="doPrint()" class="px-6 py-3 bg-primary text-accent rounded-xl text-xs font-black uppercase tracking-widest hover:scale-105 transition-all shadow-lg shadow-primary/10">
                        Cetak
                    </button>
                    <button onclick="closePrintModal()" class="w-12 h-12 rounded-xl hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all flex items-center justify-center">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="print-content" class="p-12 overflow-x-auto">
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let siswaData = {};

        const STAGE_INFO = {
            0: { label: 'HIJAU', color: 'emerald' },
            1: { label: 'KUNING', color: 'amber' },
            2: { label: 'MERAH', color: 'rose' }
        };

        (async () => {
            const user = await requireLogin();
            if (!user || !['admin', 'bk'].includes(user.role)) { window.location.href = '/dashboard'; return; }
            renderLayout(user);
            loadSurat();
        })();

        async function loadSurat() {
            const res = await api('/api/surat/rekomendasi-list');
            const el = document.getElementById('siswa-list');

            if (!res.ok) {
                el.innerHTML = `<div class="lg:col-span-2 p-10 bg-red-50 text-red-500 rounded-3xl border border-red-100 font-bold text-center">${res.error}</div>`;
                return;
            }

            const siswa = res.data || [];
            siswaData = {};
            siswa.forEach(s => siswaData[s.id_siswa] = s);

            if (siswa.length === 0) {
                el.innerHTML = `
                <div class="lg:col-span-2 py-20 text-center flex flex-col items-center gap-4">
                    <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center shadow-xl shadow-emerald-500/10">
                        <i data-lucide="check-circle" class="w-10 h-10"></i>
                    </div>
                    <div>
                        <p class="text-xl font-black text-primary italic">"Clear Queue!"</p>
                        <p class="text-sm font-medium text-slate-500 mt-1">Tidak ada siswa yang memerlukan surat saat ini.</p>
                    </div>
                </div>`;
                lucide.createIcons();
                return;
            }

            el.innerHTML = siswa.map(s => {
                const rekom = s.rekomendasi || [];
                const stageLabel = ['Hijau', 'Kuning', 'Merah', 'DO'][s.progress_level] || 'Hijau';
                const stageColor = ['emerald', 'amber', 'rose', 'slate'][s.progress_level] || 'emerald';
                
                const rekomendasiHtml = rekom.map(r => {
                    if (r.terbit) {
                        return `
                        <div class="flex items-center justify-between p-4 bg-emerald-50 rounded-2xl border border-emerald-100 mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-black text-emerald-700 uppercase">${escapeHtml(r.label)}</p>
                                    <p class="text-[9px] font-bold text-emerald-500">SUDAH DITERBITKAN</p>
                                </div>
                            </div>
                            <div class="px-3 py-1.5 bg-emerald-100 text-emerald-600 rounded-lg text-[9px] font-black">
                                ✓
                            </div>
                        </div>`;
                    } else {
                        return `
                        <div class="flex items-center justify-between p-4 bg-white rounded-2xl border border-slate-100 hover:border-accent transition-all mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center">
                                    <i data-lucide="file-plus" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-black text-primary uppercase">${escapeHtml(r.label)}</p>
                                    <p class="text-[9px] font-bold text-slate-400">BELUM DITERBITKAN</p>
                                </div>
                            </div>
                            <button onclick="showConfirmModal(${s.id_siswa}, '${r.jenis}', '${escapeHtml(s.nama)}')" class="px-4 py-2 bg-primary text-accent rounded-xl text-[9px] font-black uppercase hover:scale-105 transition-all shadow-lg cursor-pointer">
                                Terbit
                            </button>
                        </div>`;
                    }
                }).join('');

                return `
                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 premium-card animate-entry">
                    <div class="flex items-start justify-between mb-6">
                        <div class="flex items-center gap-5">
                            <div class="w-16 h-16 rounded-[1.5rem] bg-slate-50 border-2 border-white shadow-xl flex items-center justify-center text-xl font-black text-primary">
                                ${escapeHtml(s.nama.charAt(0)).toUpperCase()}
                            </div>
                            <div>
                                <h3 class="text-lg font-black text-primary tracking-tight leading-none mb-2">${escapeHtml(s.nama)}</h3>
                                <div class="flex items-center gap-3 flex-wrap">
                                    <span class="text-[9px] font-black text-slate-400 capitalize bg-slate-50 px-2 py-0.5 rounded border border-slate-100">${escapeHtml(s.kelas)}</span>
                                    <span class="flex items-center gap-1 text-[9px] font-black text-red-500 uppercase"><i data-lucide="zap" class="w-3 h-3"></i> ${s.total_poin} POIN</span>
                                    <span class="px-2 py-1 rounded-lg text-[9px] font-black uppercase bg-${stageColor}-50 text-${stageColor}-600 border border-${stageColor}-100">${stageLabel}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50/50 rounded-[2rem] p-4 border border-slate-50">
                        <div class="flex items-center gap-2 mb-4 px-2">
                            <i data-lucide="layers" class="w-3.5 h-3.5 text-slate-300"></i>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em]">Surat yang Perlu Diterbitkan</span>
                        </div>
                        ${rekomendasiHtml}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        let currentSuratData = null;
        let currentPrintData = null;

        function showConfirmModal(idSiswa, jenis, nama) {
            const labels = {
                'perjanjian_siswa': 'Surat Perjanjian Siswa',
                'pemanggilan_ortu': 'Surat Pemanggilan Orang Tua',
                'perjanjian_ortu': 'Surat Perjanjian Orang Tua',
                'do': 'Surat DO (Drop Out)',
                'pindah': 'Surat Pindah'
            };
            
            currentSuratData = { idSiswa, jenis, nama };
            document.getElementById('confirm-title').textContent = 'Konfirmasi Penerbitan';
            document.getElementById('confirm-message').innerHTML = `Apakah Anda yakin ingin menerbitkan <strong>"${labels[jenis] || jenis}"</strong> untuk siswa <strong>${nama}</strong>?`;
            document.getElementById('confirm-jenis').textContent = labels[jenis] || jenis;
            
            document.getElementById('modal-confirm').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-confirm-content').classList.remove('scale-95', 'opacity-0'), 10);
            lucide.createIcons();
        }

        function closeConfirmModal() {
            document.getElementById('modal-confirm-content').classList.add('scale-95', 'opacity-0');
            setTimeout(() => document.getElementById('modal-confirm').classList.add('hidden'), 300);
            currentSuratData = null;
        }

        async function proceedTerbit() {
            if (!currentSuratData) return;
            const { idSiswa, jenis, nama } = currentSuratData;
            closeConfirmModal();

            const tanggal = new Date().toISOString().slice(0, 10);
            let endpoint = '';
            let body = { id_siswa: idSiswa, tanggal_surat: tanggal };

            if (jenis === 'perjanjian_siswa' || jenis === 'perjanjian_ortu') {
                endpoint = '/api/surat/perjanjian';
                body.tanggal_perjanjian = tanggal;
                body.isi_perjanjian = 'Siswa berjanji untuk memperbaiki perilaku dan tidak mengulangi pelanggaran.';
                body.jenis_surat = jenis;
            } else if (jenis === 'pemanggilan_ortu') {
                endpoint = '/api/surat/pemanggilan';
                body.hari_tanggal = ''; body.pukul = ''; body.tempat = ''; body.keperluan = '';
            } else if (jenis === 'do') {
                endpoint = '/api/surat/do';
                body.alasan = 'Siswa telah melewati batas toleransi yang ditentukan.';
            } else if (jenis === 'pindah') {
                endpoint = '/api/surat/pindah';
                body.tanggal_pindah = tanggal;
                body.alasan_pindah = 'Siswa telah melewati batas toleransi yang ditentukan.';
            }

            const res = await api(endpoint, { method: 'POST', body });
            if (res.ok) {
                currentPrintData = { jenis, id: res.id, nama };
                document.getElementById('success-message').innerHTML = `<strong>${jenis}</strong> untuk <strong>${nama}</strong> berhasil diterbitkan.`;
                document.getElementById('btn-cetak').classList.toggle('hidden', !res.id);
                document.getElementById('modal-success').classList.remove('hidden');
                setTimeout(() => document.getElementById('modal-success-content').classList.remove('scale-95', 'opacity-0'), 10);
                lucide.createIcons();
                loadSurat();
            } else {
                showAlert(res.error || 'Gagal menerbitkan surat.', 'error');
            }
        }

        function closeSuccessModal() {
            document.getElementById('modal-success-content').classList.add('scale-95', 'opacity-0');
            setTimeout(() => document.getElementById('modal-success').classList.add('hidden'), 300);
        }

        async function cetakDariSukses() {
            if (!currentPrintData) return;
            closeSuccessModal();
            await openPrintModal(currentPrintData.jenis, currentPrintData.id);
        }

        async function openPrintModal(jenis, id) {
            let endpoint = '';
            if (jenis === 'pemanggilan_ortu') endpoint = `/api/surat/pemanggilan/print?id=${id}`;
            else if (jenis === 'perjanjian_siswa' || jenis === 'perjanjian_ortu') endpoint = `/api/surat/perjanjian/print?id=${id}`;
            else if (jenis === 'do') endpoint = `/api/surat/do/print?id=${id}`;
            else if (jenis === 'pindah') endpoint = `/api/surat/pindah/print?id=${id}`;

            const res = await api(endpoint);
            if (!res.ok) { showAlert(res.error, 'error'); return; }

            const content = document.getElementById('print-content');
            const s = res.surat;
            const p = res.pejabat;
            const kepsek = p['Kepala Sekolah'] || { nama_pejabat: '-', nip: '-' };
            const bk = p['Guru BK'] || { nama_pejabat: '-', nip: '-' };
            const kesiswaan = p['Wakasek Kesiswaan'] || { nama_pejabat: '-', nip: '-' };

            if (jenis === 'perjanjian_siswa' || jenis === 'perjanjian_ortu') {
                const progKeahlian = s.program_keahlian || '...................................................';
                const masalahDisplay = (s.isi_perjanjian || '...................................................').replace(/\n/g, '<br>&nbsp;&nbsp;');

                content.innerHTML = `
                    <div style="font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.5; color: #000; background: #fff; padding: 0; min-width: 650px;">
                        <img src="kop-surat.jpg" style="width: 100%; height: auto; margin-bottom: 5px;">
                        <div style="text-align: center; font-weight: bold; font-size: 18px; margin: 10px 0 20px 0; text-transform: uppercase;">SURAT PERNYATAAN SISWA</div>
                        <p style="margin-bottom: 5px;">Yang bertandatangan di bawah ini :</p>
                        <table style="width: 100%; margin-left: 20px; border-collapse: collapse;">
                            <tr><td style="width: 150px; padding-left: 20px;">Nama</td><td>: <strong>${escapeHtml(s.nama)}</strong></td></tr>
                            <tr><td style="padding-left: 20px;">NIS</td><td>: ${escapeHtml(s.nis)}</td></tr>
                            <tr><td style="padding-left: 20px;">Kelas</td><td>: ${escapeHtml(s.kelas)}</td></tr>
                            <tr><td style="padding-left: 20px;">Program Keahlian</td><td>: ${escapeHtml(s.prog_keahlian || progKeahlian)}</td></tr>
                            <tr><td style="padding-left: 20px; vertical-align: top;">Masalah</td><td style="vertical-align: top;">: ${escapeHtml(s.ortu_masalah || masalahDisplay).replace(/\n/g, '<br>&nbsp;&nbsp;')}</td></tr>
                        </table>
                        <table style="width: 100%; margin-left: 20px; margin-top: 10px; border-collapse: collapse;">
                            <tr><td style="width: 150px; padding-left: 20px;">Nama Orang Tua</td><td>: ${escapeHtml(s.ortu_nama || '...................................................') }</td></tr>
                            <tr><td style="padding-left: 20px;">Pekerjaan</td><td>: ${escapeHtml(s.ortu_pekerjaan || '...................................................') }</td></tr>
                            <tr><td style="padding-left: 20px;">Alamat Rumah</td><td>: ${escapeHtml(s.ortu_alamat || '...................................................') }</td></tr>
                            <tr><td style="padding-left: 20px;">No. Hp./Telp.</td><td>: ${escapeHtml(s.ortu_hp || '...................................................') }</td></tr>
                        </table>
                        <p style="text-align: justify; margin-top: 15px; text-indent: 10px;">Menyatakan dan berjanji akan bersungguh-sungguh berubah dan bersedia mentaati aturan dan tata tertib sekolah...</p>
                        <table style="width: 100%; margin-top: 30px; text-align: left; border-collapse: collapse;">
                            <tr>
                                <td style="width: 50%; vertical-align: top; padding-bottom: 20px;">
                                    Mengetahui,<br>Orang Tua/Wali siswa<br><br><br><br><br>.......................................................
                                </td>
                                <td style="width: 50%; vertical-align: top; padding-bottom: 20px; padding-left: 50px;">
                                    Denpasar, ${escapeHtml(s.tanggal_perjanjian || '........................')}<br>Siswa yang bersangkutan<br><br><br><br><br><strong>${escapeHtml(s.nama)}</strong>
                                </td>
                            </tr>
                            <tr>
                                <td style="width: 50%; vertical-align: top; padding-top: 20px;">
                                    Guru Bimbingan Konseling<br><br><br><br><br><u>${escapeHtml(bk.nama_pejabat)}</u>
                                </td>
                                <td style="width: 50%; vertical-align: top; padding-top: 20px; padding-left: 50px;">
                                     Guru Wali Kelas<br><br><br><br><br>.......................................................
                                </td>
                            </tr>
                        </table>
                        <div style="text-align: center; margin-top: 15px;">
                            Mengetahui<br>Wakasek Kesiswaan<br><br><br><br><br><u>${escapeHtml(kesiswaan.nama_pejabat)}</u>
                        </div>
                    </div>`;
            } else if (jenis === 'pemanggilan_ortu') {
                content.innerHTML = `
                    <div style="font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.5; color: #000; background: #fff; padding: 20px; min-width: 600px;">
                        <img src="kop-surat.jpg" style="width: 100%; height: auto; margin-bottom: 20px;">
                        
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                            <tr>
                                <td style="width: 70px;">No.</td>
                                <td>: ${escapeHtml(s.nomor || '-')}</td>
