<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SMK TI Bali Global Denpasar Student Management</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
        }

        .blob-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            filter: blur(60px);
        }

        .login-card {
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.15);
        }

        /* Animation Classes */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-entry {
            animation: slideUpFade 0.6s ease-out forwards;
        }

        /* Blob Animation */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>

<body class="bg-white min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

    <!-- 1. Background (The Link) -->
    <!-- Large Blob Top-Left (Enhanced) -->
    <div
        class="absolute -top-[20%] -left-[10%] w-[600px] h-[600px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob">
    </div>
    <!-- Small Blob Bottom-Right (Enhanced) -->
    <div
        class="absolute -bottom-[20%] -right-[10%] w-[500px] h-[500px] bg-purple-500 rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob animation-delay-2000">
    </div>
    <!-- Extra Blob Center-Left for Depth -->
    <div
        class="absolute top-[20%] -left-[20%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-blob animation-delay-4000">
    </div>

    <!-- 2. The Login Card (Center Stage) -->
    <div class="w-full max-w-md p-10 bg-white rounded-3xl login-card border border-slate-100 animate-entry">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">SMK TI Bali Global Denpasar.</h1>
            <h2 class="text-3xl font-bold text-slate-900 mt-2">Welcome Back!</h2>
            <p class="text-slate-500 font-medium mt-1 text-sm">Student Management System</p>
        </div>

        <!-- Alert -->
        <div id="login-alert"
            class="hidden mb-6 px-4 py-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-100 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
            <span id="login-alert-msg"></span>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-5">
            <!-- Username Field -->
            <div class="space-y-1.5">
                <label for="username" class="block text-sm font-semibold text-slate-700">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <input type="text" id="username" name="username" required autofocus
                        class="block w-full h-12 pl-12 pr-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition-all sm:text-sm"
                        placeholder="Masukkan username">
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="block w-full h-12 pl-12 pr-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition-all sm:text-sm"
                        placeholder="Masukkan password">
                </div>
            </div>

            <button type="submit" id="login-btn"
                class="w-full h-12 bg-[#0F172A] text-white font-semibold rounded-xl hover:bg-slate-800 transition-all shadow-lg shadow-slate-900/10 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed">
                <span>Masuk</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- 4. The "Quick Login" Section (The Transformation) -->
        <div class="mt-8 pt-8 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 text-center">Quick Login (Dev
                Mode)</p>

            <div class="grid grid-cols-2 gap-3">
                <!-- Admin Card -->
                <button onclick="quickLogin('admin','password')" type="button"
                    class="group relative overflow-hidden flex items-center justify-start gap-3 p-3 rounded-xl border border-slate-100 bg-white hover:border-[#C4F168] hover:shadow-md transition-all duration-300 cursor-pointer w-full text-left">

                    <!-- Decorative Blob (Mini) -->
                    <div
                        class="absolute top-0 right-0 w-6 h-6 bg-[#C4F168]/20 rounded-bl-xl transition-all duration-300 group-hover:scale-[5] origin-top-right">
                    </div>

                    <!-- Icon -->
                    <div
                        class="relative z-10 w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center group-hover:bg-[#C4F168] transition-colors duration-300 flex-shrink-0">
                        <i data-lucide="shield"
                            class="w-4 h-4 text-slate-600 group-hover:text-slate-900 transition-colors"></i>
                    </div>

                    <!-- Text -->
                    <span
                        class="relative z-10 text-xs font-semibold text-slate-600 group-hover:text-slate-900 transition-colors">Admin</span>
                </button>

                <!-- Guru BK Card -->
                <button onclick="quickLogin('bk','password')" type="button"
                    class="group relative overflow-hidden flex items-center justify-start gap-3 p-3 rounded-xl border border-slate-100 bg-white hover:border-[#C4F168] hover:shadow-md transition-all duration-300 cursor-pointer w-full text-left">

                    <!-- Decorative Blob (Mini) -->
                    <div
                        class="absolute top-0 right-0 w-6 h-6 bg-[#C4F168]/20 rounded-bl-xl transition-all duration-300 group-hover:scale-[5] origin-top-right">
                    </div>

                    <!-- Icon -->
                    <div
                        class="relative z-10 w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center group-hover:bg-[#C4F168] transition-colors duration-300 flex-shrink-0">
                        <i data-lucide="file-text"
                            class="w-4 h-4 text-slate-600 group-hover:text-slate-900 transition-colors"></i>
                    </div>

                    <!-- Text -->
                    <span
                        class="relative z-10 text-xs font-semibold text-slate-600 group-hover:text-slate-900 transition-colors">Guru
                        BK</span>
                </button>

                <!-- Guru Card -->
                <button onclick="quickLogin('guru','password')" type="button"
                    class="group relative overflow-hidden flex items-center justify-start gap-3 p-3 rounded-xl border border-slate-100 bg-white hover:border-[#C4F168] hover:shadow-md transition-all duration-300 cursor-pointer w-full text-left">

                    <!-- Decorative Blob (Mini) -->
                    <div
                        class="absolute top-0 right-0 w-6 h-6 bg-[#C4F168]/20 rounded-bl-xl transition-all duration-300 group-hover:scale-[5] origin-top-right">
                    </div>

                    <!-- Icon -->
                    <div
                        class="relative z-10 w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center group-hover:bg-[#C4F168] transition-colors duration-300 flex-shrink-0">
                        <i data-lucide="user-check"
                            class="w-4 h-4 text-slate-600 group-hover:text-slate-900 transition-colors"></i>
                    </div>

                    <!-- Text -->
                    <span
                        class="relative z-10 text-xs font-semibold text-slate-600 group-hover:text-slate-900 transition-colors">Guru</span>
                </button>

                <!-- Siswa Card -->
                <button onclick="quickLogin('12345','password')" type="button"
                    class="group relative overflow-hidden flex items-center justify-start gap-3 p-3 rounded-xl border border-slate-100 bg-white hover:border-[#C4F168] hover:shadow-md transition-all duration-300 cursor-pointer w-full text-left">

                    <!-- Decorative Blob (Mini) -->
                    <div
                        class="absolute top-0 right-0 w-6 h-6 bg-[#C4F168]/20 rounded-bl-xl transition-all duration-300 group-hover:scale-[5] origin-top-right">
                    </div>

                    <!-- Icon -->
                    <div
                        class="relative z-10 w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center group-hover:bg-[#C4F168] transition-colors duration-300 flex-shrink-0">
                        <i data-lucide="graduation-cap"
                            class="w-4 h-4 text-slate-600 group-hover:text-slate-900 transition-colors"></i>
                    </div>

                    <!-- Text -->
                    <span
                        class="relative z-10 text-xs font-semibold text-slate-600 group-hover:text-slate-900 transition-colors">Siswa</span>
                </button>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-xs text-slate-400">© 2026 SMK TI Bali Global Denpasar Student Management — SMK TI Bali Global Denpasar</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/app.js"></script>
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Cek apakah sudah login
        checkAuth().then(user => {
            if (user) window.location.href = '/dashboard';
        });

        // Handle form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const alert = document.getElementById('login-alert');
            const alertMsg = document.getElementById('login-alert-msg');
            const originalBtnContent = btn.innerHTML;

            // Loading State
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memproses...</span>`;
            lucide.createIcons(); // Re-init icon for spinner
            alert.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await api('/api/login', {
                    method: 'POST',
                    body: { username, password },
                });

                if (res.ok) {
                    // Success animation or delay could go here if desired
                    window.location.href = '/dashboard';
                } else {
                    throw new Error(res.error || 'Login gagal.');
                }
            } catch (err) {
                // Error State
                alertMsg.textContent = err.message;
                alert.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
                lucide.createIcons(); // Re-init icons
            }
        });

        // Quick login for development
        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            // Trigger submit event manually
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }
    </script>
</body>

</html>
