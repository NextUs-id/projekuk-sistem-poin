<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pelanggaran — SMK TI Bali Global Denpasar</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Poppins', sans-serif;
            --color-primary: #0F172A;
            --color-accent: #C4F168;
            --color-surface: #ffffff;
            --color-bg: #F8FAFC;
        }

        .premium-card {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        /* ── Pelanggaran Panel Animations ─────────────────────────────── */
        .panels-wrapper {
            display: flex;
            justify-content: center;
            gap: 2rem;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .form-panel {
            width: 100%;
            max-width: 42rem;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .panels-wrapper.expanded .form-panel {
            max-width: calc(50% - 1rem);
        }

        .detail-panel {
            width: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            transform: translateX(40px) scale(0.95);
        }

        .panels-wrapper.expanded .detail-panel {
            width: 100%;
            max-width: calc(50% - 1rem);
            opacity: 1;
            overflow: visible;
            transform: translateX(0) scale(1);
        }

        @media (max-width: 1024px) {
            .panels-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .form-panel, .panels-wrapper.expanded .form-panel {
                max-width: 100%;
            }
            .detail-panel, .panels-wrapper.expanded .detail-panel {
                max-width: 100%;
                width: 100%;
                transform: translateY(20px) scale(0.95);
            }
            .panels-wrapper.expanded .detail-panel {
                transform: translateY(0) scale(1);
            }
        }

        /* Scrollbar styles and New Entry Animation */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5); /* slate-100/50 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #CBD5E1; /* slate-300 */
            border-radius: 10px;
        }
        
        @keyframes flashNew {
            0% { background-color: #C4F168; transform: translateX(-10px); opacity: 0; box-shadow: 0 0 20px rgba(196, 241, 104, 0.5); border-color: #0F172A; }
            30% { transform: translateX(5px); opacity: 1; }
            100% { background-color: rgba(248, 250, 252, 0.5); transform: translateX(0); box-shadow: none; border-color: transparent;}
        }

        .animate-flash-new {
            animation: flashNew 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] min-h-screen font-sans relative overflow-x-hidden">
    <!-- Background Blobs -->
    <div
        class="fixed -top-[10%] -left-[5%] w-[500px] h-[500px] bg-[#C4F168] rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10">
    </div>
    <div class="fixed -bottom-[10%] -right-[5%] w-[400px] h-[400px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-20 animate-blob -z-10"
        style="animation-delay: 2s;"></div>

    <!-- Layout wrapper -->
    <div id="app"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full animate-entry">
        <!-- Header Section -->
        <div class="flex flex-col items-center text-center gap-4 mb-12">
            <div
                class="w-16 h-16 bg-primary rounded-3xl flex items-center justify-center shadow-2xl shadow-primary/20 rotate-3">
                <i data-lucide="pen-tool" class="w-8 h-8 text-accent -rotate-3"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black text-primary tracking-tight">Input Pelanggaran</h1>
                <p class="text-slate-500 text-sm font-medium mt-1">Catat dan pantau kedisiplinan siswa secara real-time
                </p>
            </div>
        </div>

        <div id="panels-wrapper" class="panels-wrapper">
            <!-- ══ FORM PANEL ══ -->
            <div class="form-panel">
                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 md:p-10 premium-card">
                    <form id="pelanggaran-form" class="space-y-8">
                        <!-- Pilih Siswa -->
                        <div class="space-y-2">
                            <label
                                class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Siswa
                                Terlibat</label>
                            <div class="relative group">
                                <i data-lucide="user-search"
                                    class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                                <select id="f-siswa" required
                                    class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none cursor-pointer">
                                    <option value="">— Cari & Pilih Siswa —</option>
                                </select>
                                <i data-lucide="chevron-down"
                                    class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>

                        <!-- Pilih Jenis -->
                        <div class="space-y-2">
                            <label
                                class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Jenis
                                Pelanggaran</label>
                            <div class="relative group">
                                <i data-lucide="alert-circle"
                                    class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                                <select id="f-jenis" required
                                    class="w-full pl-11 pr-10 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all appearance-none cursor-pointer">
                                    <option value="">— Pilih Jenis —</option>
                                </select>
                                <i data-lucide="chevron-down"
                                    class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                            </div>
                            <div id="poin-preview-container" class="hidden flex items-center gap-2 mt-2 ml-1">
                                <span
                                    class="text-[10px] font-black text-red-500 uppercase tracking-widest bg-red-50 px-2 py-0.5 rounded-md"
                                    id="poin-preview"></span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <!-- Tanggal -->
                            <div class="space-y-2">
                                <label
                                    class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Tanggal
                                    Kejadian</label>
                                <div class="relative group">
                                    <i data-lucide="calendar"
                                        class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 group-focus-within:text-primary transition-colors"></i>
                                    <input type="date" id="f-tanggal" required
                                        class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all cursor-pointer">
                                </div>
                            </div>

                            <!-- Petugas -->
                            <div class="space-y-2">
                                <label
                                    class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Pelapor</label>
                                <div class="flex items-center gap-3 px-1 py-3 text-sm font-bold text-slate-400 italic"
                                    id="f-pelapor">-</div>
                            </div>
                        </div>

                        <!-- Keterangan -->
                        <div class="space-y-2">
                            <label
                                class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Kronologi
                                / Catatan Tambahan</label>
                            <textarea id="f-keterangan" rows="4"
                                class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-sm font-bold text-primary focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 outline-none transition-all resize-none placeholder:text-slate-300"
                                placeholder="Jelaskan detail kejadian jika diperlukan..."></textarea>
                        </div>

                        <button type="submit" id="submit-btn"
                            class="group w-full py-5 bg-primary text-accent rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-primary/10 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3">
                            <i data-lucide="save" class="w-5 h-5 group-hover:animate-bounce"></i>
                            Simpan Pelanggaran
                        </button>
                    </form>
                </div>
            </div>

            <!-- ══ DETAIL PANEL ══ -->
            <div id="detail-panel" class="detail-panel">
                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 premium-card sticky top-8">
                    <div class="flex items-center justify-between mb-8">
                        <h3 class="text-xs font-black text-primary uppercase tracking-[0.2em] flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-accent animate-pulse"></span>
                            Detail Siswa
                        </h3>
                        <i data-lucide="info" class="w-4 h-4 text-slate-300"></i>
                    </div>

                    <div id="preview-content" class="text-sm text-slate-600">
                        <div
                            class="flex flex-col items-center justify-center py-20 text-center gap-4 border-2 border-dashed border-slate-100 rounded-[2rem]">
                            <div
                                class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center text-slate-300">
                                <i data-lucide="users" class="w-8 h-8"></i>
                            </div>
                            <p class="text-xs font-bold text-slate-300 uppercase tracking-widest">Pilih siswa
                                untuk<br>memuat profil</p>
                        </div>
                    </div>

                    <!-- Riwayat Pelanggaran Terakhir -->
                    <div id="riwayat-section" class="hidden mt-10 space-y-5 animate-entry">
                        <div class="flex items-center justify-between px-1">
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Riwayat Terakhir
                            </h4>
                            <span
                                class="text-[10px] font-black text-accent bg-primary px-2 py-0.5 rounded-md uppercase tracking-tighter">Live
                                Trace</span>
                        </div>
                        <div id="riwayat-content" class="space-y-3 max-h-[250px] overflow-y-auto pr-2 custom-scrollbar">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        let siswaList = [];
        let jenisData = [];

        (async () => {
            const user = await requireLogin();
            if (!user || !['admin', 'bk', 'guru'].includes(user.role)) {
                window.location.href = '/dashboard';
                return;
            }
            renderLayout(user);

            document.getElementById('f-pelapor').innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center mr-2">
                    <i data-lucide="user-check" class="w-4 h-4 text-primary"></i>
                </div>
                <span>${user.nama_asli} <span class="text-[10px] uppercase font-black tracking-tighter bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded ml-1">${user.role}</span></span>
            `;

            // Set default tanggal = hari ini
            document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);

            // Load siswa dan jenis paralel
            const [siswaRes, jenisRes] = await Promise.all([
                api('/api/siswa'),
                api('/api/jenis/grouped'),
            ]);

            // Populate siswa dropdown
            if (siswaRes.ok) {
                siswaList = siswaRes.data;
                const sel = document.getElementById('f-siswa');
                siswaRes.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id_siswa;
                    opt.textContent = `${s.nis} — ${s.nama} (${s.kelas})`;
                    sel.appendChild(opt);
                });
            }

            // Populate jenis dropdown (grouped)
            if (jenisRes.ok) {
                const sel = document.getElementById('f-jenis');
                jenisRes.data.forEach(group => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = group.label.toUpperCase();
                    group.items.forEach(j => {
                        jenisData.push(j);
                        const opt = document.createElement('option');
                        opt.value = j.id_jenis;
                        opt.textContent = `${j.nama_jenis}`;
                        opt.dataset.poin = j.poin;
                        optgroup.appendChild(opt);
                    });
                    sel.appendChild(optgroup);
                });
            }

            // Preview poin saat pilih jenis
            const fJenis = document.getElementById('f-jenis');
            if (fJenis) {
                fJenis.addEventListener('change', (e) => {
                    const poin = e.target.selectedOptions[0]?.dataset?.poin;
                    const preview = document.getElementById('poin-preview');
                    const container = document.getElementById('poin-preview-container');
                    if (poin) {
                        preview.textContent = `Pinalti: +${poin} POIN`;
                        container.classList.remove('hidden');
                    } else {
                        container.classList.add('hidden');
                    }
                });
            }

            // ✨ ANIMASI: Preview siswa saat dipilih
            const fSiswa = document.getElementById('f-siswa');
            const panelsWrapper = document.getElementById('panels-wrapper');

            if (fSiswa) {
                fSiswa.addEventListener('change', async (e) => {
                    const id = parseInt(e.target.value);

                    if (!id) {
                        panelsWrapper.classList.remove('expanded');
                        document.getElementById('riwayat-section').classList.add('hidden');
                        document.getElementById('preview-content').innerHTML = `
                            <div class="flex flex-col items-center justify-center py-20 text-center gap-4 border-2 border-dashed border-slate-100 rounded-[2rem]">
                                <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center text-slate-300">
                                    <i data-lucide="users" class="w-8 h-8"></i>
                                </div>
                                <p class="text-xs font-bold text-slate-300 uppercase tracking-widest">Pilih siswa untuk<br>memuat profil</p>
                            </div>
                        `;
                        lucide.createIcons();
                        return;
                    }

                    panelsWrapper.classList.add('expanded');

                    const res = await api(`/api/siswa/detail?id=${id}`);
                    if (res.ok) {
                        const s = res.siswa;
                        const sLevel = s.progress_level !== undefined ? s.progress_level : 0;

                        document.getElementById('preview-content').innerHTML = `
                            <div class="space-y-6 animate-entry">
                                <div class="flex items-center gap-5 p-4 bg-slate-50 rounded-3xl border border-slate-100 shadow-sm shadow-slate-200/50">
                                    <div class="w-20 h-20 rounded-2xl bg-primary flex items-center justify-center text-accent font-black text-2xl flex-shrink-0 shadow-lg shadow-primary/10">
                                        ${escapeHtml(s.nama.charAt(0))}
                                    </div>
                                    <div>
                                        <p class="font-black text-primary text-xl tracking-tight leading-tight">${escapeHtml(s.nama)}</p>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1 flex items-center gap-2">
                                            <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>${escapeHtml(s.nis)}
                                        </p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-slate-50/50 rounded-[2rem] p-5 border border-slate-50">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Kelas Program</p>
                                        <div class="flex items-center gap-2 font-black text-primary text-lg">
                                            <i data-lucide="home" class="w-4 h-4 text-accent bg-primary p-1 rounded-md"></i>
                                            ${escapeHtml(s.kelas)}
                                        </div>
                                    </div>
                                    <div class="bg-slate-50/50 rounded-[2rem] p-5 border border-slate-50">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Akumulasi Poin</p>
                                        <div class="flex items-center gap-2 font-black ${res.total_poin >= 30 ? 'text-red-500' : 'text-primary'} text-lg">
                                            <i data-lucide="zap" class="w-4 h-4 text-accent bg-primary p-1 rounded-md"></i>
                                            ${res.total_poin} <span class="text-[10px] font-bold text-slate-300 tracking-normal opacity-50 uppercase">Poin</span>
                                        </div>
                                    </div>
                                    <div class="col-span-2 bg-slate-50 rounded-[2rem] p-6 border border-slate-100/50">
                                        <div class="flex justify-between items-center mb-4">
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Progress Pelanggaran</p>
                                            <span class="text-[9px] font-black text-primary uppercase tracking-widest bg-accent px-2 py-0.5 rounded-md">Level ${sLevel + 1}</span>
                                        </div>
                                        <div class="w-full h-3 bg-white rounded-full overflow-hidden border border-slate-100 p-0.5 shadow-inner">
                                            <div class="h-full rounded-full transition-all duration-1000 ${res.total_poin >= 30 ? 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.3)]' : 'bg-primary shadow-[0_0_10px_rgba(15,23,42,0.2)]'}" 
                                                 style="width: ${Math.min((res.total_poin / 30) * 100, 100)}%"></div>
                                        </div>
                                        <div class="mt-4 flex flex-wrap gap-2">
                                            <div class="inline-flex scale-90 origin-left">${levelBadge(sLevel)}</div>
                                            <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1 italic">${res.total_poin >= 30 ? '⚠️ Melewati ambang 30 poin — penerbitan surat direkomendasikan' : 'Rekomendasi surat jika mencapai 30 Poin'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        lucide.createIcons();
                        loadRiwayat(id);
                    }
                });
            }

            // Submit Form
            const form = document.getElementById('pelanggaran-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('submit-btn');
                    const btnText = btn.innerHTML;
                    btn.disabled = true;
                    btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Memproses...';
                    lucide.createIcons();

                    const valSiswa = document.getElementById('f-siswa').value;
                    const valJenis = document.getElementById('f-jenis').value;

                    const body = {
                        id_siswa: parseInt(valSiswa),
                        id_jenis: parseInt(valJenis),
                        tanggal: document.getElementById('f-tanggal').value,
                        keterangan: document.getElementById('f-keterangan').value.trim(),
                    };

                    const res = await api('/api/pelanggaran/store', { method: 'POST', body });

                    btn.disabled = false;
                    btn.innerHTML = btnText;
                    lucide.createIcons();

                    if (res.ok) {
                        showAlert(res.message || 'Pelanggaran berhasil dicatat!', 'success');

                        // Pertahankan filter siswa agar preview tetap muncul
                        const currSiswa = document.getElementById('f-siswa').value;

                        form.reset();
                        document.getElementById('f-siswa').value = currSiswa;
                        document.getElementById('f-tanggal').value = new Date().toISOString().slice(0, 10);
                        document.getElementById('poin-preview-container').classList.add('hidden');

                        // Flag animasi flash
                        window._isNewInput = true;

                        // Refresh data
                        document.getElementById('f-siswa').dispatchEvent(new Event('change'));

                    } else {
                        showAlert(res.error || 'Gagal menyimpan.', 'error');
                    }
                });
            }
        })();

        function levelBadge(level) {
            const levels = [
                { label: 'HIJAU / AMAN', bg: 'bg-emerald-50 shadow-emerald-500/10', text: 'text-emerald-500', icon: 'check-circle' },
                { label: 'KUNING / PERINGATAN', bg: 'bg-amber-50 shadow-amber-500/10', text: 'text-amber-500', icon: 'alert-circle' },
                { label: 'MERAH / KRITIS', bg: 'bg-red-50 shadow-red-500/10', text: 'text-red-500', icon: 'alert-triangle' },
                { label: 'DO / DROP OUT', bg: 'bg-gray-900 shadow-primary/30', text: 'text-accent', icon: 'skull' },
            ];
            const l = levels[level] || levels[0];
            return `<span class="flex items-center gap-2 px-4 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest border border-slate-50 shadow-2xl ${l.bg} ${l.text}"><i data-lucide="${l.icon}" class="w-3.5 h-3.5"></i>${l.label}</span>`;
        }

        async function loadRiwayat(idSiswa) {
            const section = document.getElementById('riwayat-section');
            const content = document.getElementById('riwayat-content');

            try {
                const res = await api(`/api/pelanggaran/recent?limit=10&siswa_id=${idSiswa}`);
                if (res.ok && res.data && res.data.length > 0) {
                    section.classList.remove('hidden');
                    content.innerHTML = res.data.map((p, index) => {
                        const isNew = window._isNewInput && index === 0;
                        return `
                        <div class="group flex items-center justify-between p-4 bg-slate-50/50 hover:bg-white rounded-[1.5rem] border border-slate-50 hover:border-accent transition-all hover:shadow-lg hover:shadow-accent/5 ${isNew ? 'animate-flash-new' : ''}">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-white rounded-xl shadow-sm flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-accent transition-all">
                                    <i data-lucide="file-warning" class="w-4 h-4"></i>
                                </div>
                                <div>
                                    <p class="text-[11px] font-black font-primary tracking-tight text-primary">${escapeHtml(p.nama_jenis || p.jenis || '-')}</p>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">${p.tanggal || '-'}</p>
                                </div>
                            </div>
                            <span class="text-xs font-black text-red-500">+${p.poin || 0}</span>
                        </div>
                    `}).join('');
                    if (window._isNewInput) window._isNewInput = false;
                } else {
                    section.classList.remove('hidden');
                    content.innerHTML = `
                         <div class="p-6 text-center border-2 border-dotted border-slate-100 rounded-[1.5rem]">
                            <p class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">Siswa ini belum memiliki<br>catatan pelanggaran.</p>
                        </div>
                    `;
                }
                lucide.createIcons();
            } catch {
                section.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
